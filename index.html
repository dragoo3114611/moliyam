<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moliyam — shaxsiy moliya nazorati</title>
<meta name="description" content="Moliyam — kirim, chiqim, qarz, byudjet va maqsadlarni bir joyda boshqarish uchun oflayn ilova.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230E7C7B'/%3E%3Cpath d='M32 12c8 0 14 6 14 14v26H18V26c0-8 6-14 14-14z' fill='none' stroke='%23F2C14E' stroke-width='4'/%3E%3Cpath d='M32 26v18M25 33h14' stroke='%23F2C14E' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ============================================================
   MOLIYAM — dizayn tizimi
   Rang: O'zbek koshin feruzasi (turkuaz) + oltin so'm urg'usi
   ============================================================ */
:root{
  --f-sans: "Segoe UI Variable Text","Segoe UI",Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --f-num: "Segoe UI Variable Display","Segoe UI",Inter,system-ui,sans-serif;

  --teal-900:#07403F; --teal-700:#0E7C7B; --teal-500:#17A2A2; --teal-100:#D6EFEE;
  --gold-600:#B9812A; --gold-500:#E0A93B; --gold-100:#FAEDD2;
  --up:#1E8E5E; --up-soft:#E4F4EC;
  --down:#C0453C; --down-soft:#FBEAE8;
  --warn:#C97A16; --warn-soft:#FCF0DC;

  --bg:#F1F4F5;
  --panel:#FFFFFF;
  --panel-2:#F7F9FA;
  --ink:#12212A;
  --ink-2:#4A6069;
  --ink-3:#7C939C;
  --line:#DDE5E8;
  --line-2:#EAF0F1;
  --shadow:0 1px 2px rgba(11,42,50,.06), 0 8px 24px -12px rgba(11,42,50,.22);
  --shadow-lg:0 24px 60px -24px rgba(11,42,50,.45);
  --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:22px;
  --sidebar:246px;
}
html[data-theme="dark"]{
  --bg:#0C1519;
  --panel:#122027;
  --panel-2:#0F1B21;
  --ink:#EAF2F3;
  --ink-2:#A9C0C6;
  --ink-3:#769199;
  --line:#22343C;
  --line-2:#1A2B32;
  --teal-100:#123634;
  --gold-100:#3A2E14;
  --up-soft:#102E23; --down-soft:#33191A; --warn-soft:#33260F;
  --up:#4FBE8B; --down:#E4756B; --warn:#E0A040; --teal-500:#2CC3C0; --teal-700:#25AEAC;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  --shadow-lg:0 30px 70px -28px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--f-sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--teal-700)}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2.5px solid var(--teal-500);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Karkas ---------- */
.app{display:grid;grid-template-columns:var(--sidebar) 1fr;height:100vh}
.side{
  background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px}
.brand-mark{width:38px;height:38px;flex:0 0 38px;border-radius:11px;background:var(--teal-700);display:grid;place-items:center}
.brand-name{font-size:18px;font-weight:700;letter-spacing:.01em}
.brand-sub{font-size:11.5px;color:var(--ink-3);margin-top:-2px}
.nav{padding:6px 10px;overflow:auto;flex:1}
.nav-group{font-size:11px;color:var(--ink-3);padding:14px 10px 6px;font-weight:600}
.nav-item{
  width:100%;display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;
  color:var(--ink-2);font-weight:550;font-size:14.5px;text-align:left;transition:background .12s,color .12s;
}
.nav-item svg{flex:0 0 19px;opacity:.85}
.nav-item:hover{background:var(--panel-2);color:var(--ink)}
.nav-item.on{background:var(--teal-100);color:var(--teal-700);font-weight:650}
html[data-theme="dark"] .nav-item.on{color:var(--teal-500)}
.nav-item .badge{margin-left:auto;font-size:11.5px;background:var(--down-soft);color:var(--down);padding:1px 7px;border-radius:20px;font-weight:700}
.side-foot{padding:12px;border-top:1px solid var(--line-2);display:flex;gap:8px;align-items:center}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{
  display:flex;align-items:center;gap:12px;padding:14px 26px;
  border-bottom:1px solid var(--line);background:var(--panel);
}
.search{
  flex:1;max-width:460px;display:flex;align-items:center;gap:9px;
  background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:8px 12px;
}
.search input{border:0;background:none;outline:none;width:100%;font-size:14.5px}
.search kbd{font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-family:var(--f-sans)}
.view{padding:24px 26px 60px;overflow:auto;flex:1;scroll-behavior:smooth}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.view-head h1{font-size:24px}
.view-head p{margin:3px 0 0;color:var(--ink-3);font-size:13.5px}

/* ---------- Tugmalar ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 15px;border-radius:10px;font-weight:600;font-size:14px;
  background:var(--panel);border:1px solid var(--line);color:var(--ink);
  transition:background .13s,border-color .13s,transform .06s;
}
.btn:hover{background:var(--panel-2)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--teal-700);border-color:var(--teal-700);color:#fff}
.btn-primary:hover{background:var(--teal-900);border-color:var(--teal-900)}
html[data-theme="dark"] .btn-primary{color:#04211F}
.btn-danger{background:var(--down);border-color:var(--down);color:#fff}
.btn-danger:hover{filter:brightness(.93)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--panel-2);color:var(--ink)}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:8px}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);color:var(--ink-2)}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
.fab{
  position:fixed;right:26px;bottom:26px;z-index:40;
  height:56px;padding:0 22px 0 18px;border-radius:18px;
  background:var(--teal-700);color:#fff;font-weight:700;font-size:15.5px;
  display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-lg);
  transition:transform .12s;
}
.fab:hover{transform:translateY(-2px)}
html[data-theme="dark"] .fab{color:#04211F}

/* ---------- Kartalar ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow)}
.card-pad{padding:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line-2)}
.card-head h3{font-size:15.5px}
.card-head .sub{font-size:12.5px;color:var(--ink-3);font-weight:500}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-32{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.g-23{grid-template-columns:minmax(0,1fr) minmax(0,1.55fr)}
@media(max-width:1180px){.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-32,.g-23,.g-3{grid-template-columns:minmax(0,1fr)}}
@media(max-width:760px){.g-2,.g-4{grid-template-columns:minmax(0,1fr)}}

/* Balans paneli — koshin ravog'i shakli */
.hero{
  background:linear-gradient(158deg,var(--teal-900),var(--teal-700) 62%,#12908E);
  color:#fff;border-radius:26px 26px 14px 14px;padding:22px 24px;position:relative;overflow:hidden;
  box-shadow:var(--shadow-lg);
}
.hero:after{
  content:"";position:absolute;right:-70px;top:-90px;width:300px;height:300px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:rgba(255,255,255,.055);
}
.hero .lbl{font-size:13px;opacity:.82;font-weight:550}
.hero .big{font-size:clamp(30px,4.4vw,44px);font-weight:700;margin-top:4px;line-height:1.08}
.hero .cur{font-size:.5em;opacity:.75;font-weight:600;margin-left:6px}
.hero-row{display:flex;gap:26px;margin-top:16px;flex-wrap:wrap;position:relative}
.hero-row div span{display:block;font-size:12px;opacity:.8}
.hero-row div b{font-size:17px;font-weight:650}
.hero .eye{position:absolute;right:20px;top:20px;color:#fff;opacity:.7}
.hero .eye:hover{opacity:1}

.stat{padding:16px 17px}
.stat .t{display:flex;align-items:center;gap:9px;color:var(--ink-3);font-size:13px;font-weight:600}
.stat .v{font-size:23px;font-weight:700;margin-top:7px}
.stat .d{font-size:12.5px;margin-top:5px;color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px}
.pill.up{background:var(--up-soft);color:var(--up)}
.pill.down{background:var(--down-soft);color:var(--down)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--panel-2);color:var(--ink-3)}
.save-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:20px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.save-pill.ok{background:var(--up-soft);color:var(--up)}
.save-pill.wait{background:var(--warn-soft);color:var(--warn)}
.save-pill.bad{background:var(--down-soft);color:var(--down)}
.save-pill:hover{filter:brightness(.97)}
.save-pill svg{flex:0 0 auto}
@media(max-width:820px){.save-pill span{display:none}.save-pill{padding:7px 9px}}
.dot{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.tint{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex:0 0 36px}

/* ---------- Ro'yxat / jadval ---------- */
table{width:100%;border-collapse:collapse}
th{
  text-align:left;font-size:12px;color:var(--ink-3);font-weight:650;
  padding:9px 14px;border-bottom:1px solid var(--line-2);white-space:nowrap;
}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
td{padding:11px 14px;border-bottom:1px solid var(--line-2);font-size:14px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--panel-2)}
.amt{font-weight:650;white-space:nowrap;text-align:right}
.amt.in{color:var(--up)}
.amt.out{color:var(--down)}
.amt.tr{color:var(--ink-2)}
.row-act{display:flex;gap:4px;justify-content:flex-end;opacity:0;transition:opacity .12s}
tr:hover .row-act,tr:focus-within .row-act{opacity:1}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
.tag{display:inline-block;font-size:11.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--ink-2)}

/* ---------- Forma ---------- */
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.input,select.input,textarea.input{
  width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel-2);outline:none;transition:border-color .12s,box-shadow .12s;
}
.input:focus{border-color:var(--teal-500);box-shadow:0 0 0 3px var(--teal-100)}
.input.err{border-color:var(--down);box-shadow:0 0 0 3px var(--down-soft)}
textarea.input{resize:vertical;min-height:64px}
.amount-input{font-family:var(--f-num);font-size:30px;font-weight:700;padding:8px 12px;text-align:right;letter-spacing:-.02em}
.err-msg{color:var(--down);font-size:12.5px;margin-top:5px;display:none}
.err-msg.on{display:block}
.row{display:flex;gap:11px}
.row>*{flex:1;min-width:0}
.seg{display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{flex:1;padding:8px 10px;border-radius:9px;font-weight:650;font-size:14px;color:var(--ink-2);transition:.12s}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.seg button.on[data-v="income"]{color:var(--up)}
.seg button.on[data-v="expense"]{color:var(--down)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:10px;
  border:1px solid var(--line);background:var(--panel-2);font-size:13.5px;font-weight:550;transition:.12s
}
.chip:hover{border-color:var(--teal-500)}
.chip.on{background:var(--teal-100);border-color:var(--teal-500);color:var(--teal-700);font-weight:650}
html[data-theme="dark"] .chip.on{color:var(--teal-500)}
.switch{position:relative;width:42px;height:24px;border-radius:20px;background:var(--line);transition:.15s;flex:0 0 42px}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--teal-700)}
.switch.on:after{left:21px}
.set-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line-2)}
.set-row:last-child{border-bottom:0}
.set-row .t{flex:1}
.set-row .t b{font-weight:600;font-size:14.5px}
.set-row .t span{display:block;font-size:12.5px;color:var(--ink-3)}

/* ---------- Progress ---------- */
.bar{height:9px;border-radius:20px;background:var(--line-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:20px;background:var(--teal-500);transition:width .4s cubic-bezier(.2,.8,.2,1)}
.bar.ok>i{background:var(--up)}
.bar.warn>i{background:var(--warn)}
.bar.over>i{background:var(--down)}

/* ---------- Modal ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(9,26,32,.55);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;padding:44px 16px;z-index:60;overflow:auto;
  animation:fade .14s ease-out;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
.modal{
  width:100%;max-width:520px;background:var(--panel);border-radius:var(--r-xl);
  box-shadow:var(--shadow-lg);animation:pop .18s cubic-bezier(.2,.8,.2,1);border:1px solid var(--line);
}
.modal.wide{max-width:820px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:17px 20px;border-bottom:1px solid var(--line-2)}
.modal-head h2{font-size:17.5px}
.modal-body{padding:18px 20px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line-2)}
.modal-foot .grow{margin-right:auto}

/* ---------- Bo'sh holat / toast ---------- */
.empty{text-align:center;padding:52px 20px}
.empty .ic{width:64px;height:64px;border-radius:20px;background:var(--panel-2);display:grid;place-items:center;margin:0 auto 14px;color:var(--ink-3)}
.empty h3{font-size:16.5px;margin-bottom:5px}
.empty p{color:var(--ink-3);margin:0 0 16px;font-size:14px}
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:9px;align-items:center}
.toast{
  background:var(--ink);color:var(--bg);padding:11px 17px;border-radius:12px;font-size:14px;font-weight:550;
  box-shadow:var(--shadow-lg);animation:pop .18s;display:flex;align-items:center;gap:9px;max-width:92vw
}
.toast.ok{background:var(--up);color:#fff}
.toast.bad{background:var(--down);color:#fff}

/* ---------- Diagramma ---------- */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:var(--f-sans);fill:var(--ink-3);font-size:11px}
.chart .gl{stroke:var(--line-2);stroke-width:1}
.legend{display:flex;flex-direction:column;gap:9px}
.legend .li{display:flex;align-items:center;gap:9px;font-size:13.5px}
.legend .li b{margin-left:auto;font-weight:650;font-variant-numeric:tabular-nums}
.insight{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.insight:last-child{border-bottom:0}
.insight .tint{width:32px;height:32px;flex:0 0 32px;border-radius:10px;font-size:15px}
.insight p{margin:0;font-size:13.8px;line-height:1.45}

/* ---------- Onboarding / qulf ---------- */
.gate{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;padding:20px;overflow:auto}
.gate-card{width:100%;max-width:470px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);padding:28px}
.steps{display:flex;gap:6px;margin-bottom:20px}
.steps i{height:4px;flex:1;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--teal-700)}
.pin-dots{display:flex;gap:12px;justify-content:center;margin:22px 0}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);transition:.12s}
.pin-dots i.on{background:var(--teal-700);border-color:var(--teal-700)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:270px;margin:0 auto}
.keypad button{height:56px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);font-size:20px;font-weight:650;font-family:var(--f-num)}
.keypad button:hover{background:var(--teal-100)}

/* ---------- Chop etish ---------- */
@media print{
  body{overflow:visible;background:#fff}
  .side,.topbar,.fab,#toasts,.no-print{display:none!important}
  .app{display:block;height:auto}
  .view{overflow:visible;padding:0;height:auto}
  .card{box-shadow:none;border-color:#ccc;break-inside:avoid}
  .hero{background:#0E7C7B!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:var(--sidebar);z-index:70;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:var(--shadow-lg)}
  .view{padding:16px 14px 90px}
  .topbar{padding:11px 14px}
}
.menu-btn{display:none}
@media(max-width:900px){.menu-btn{display:grid}}
</style>
</head>
<body>
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="brand">
      <div class="brand-mark">
        <svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M32 12c8 0 14 6 14 14v26H18V26c0-8 6-14 14-14z" fill="none" stroke="#F2C14E" stroke-width="5"/>
          <path d="M32 27v17M25 34h14" stroke="#F2C14E" stroke-width="5" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Moliyam</div>
        <div class="brand-sub">Shaxsiy moliya nazorati</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button class="icon-btn" id="themeBtn" title="Mavzuni almashtirish" aria-label="Mavzuni almashtirish"></button>
      <button class="icon-btn" id="lockBtn" title="Ilovani qulflash" aria-label="Ilovani qulflash" hidden></button>
      <div class="small muted" style="margin-left:auto" id="verLbl">v1.0</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">

const MONTHS = ["Yanvar","Fevral","Mart","Aprel","May","Iyun","Iyul","Avgust","Sentabr","Oktabr","Noyabr","Dekabr"];
const MONTHS_SHORT = ["Yan","Fev","Mar","Apr","May","Iyn","Iyl","Avg","Sen","Okt","Noy","Dek"];

const ymd = (d) => { const x = new Date(d); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); };
const today = () => ymd(new Date());
const nowTime = () => { const d = new Date(); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
const parseYmd = (s) => { const p = String(s).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); };
const monthKey = (s) => String(s).slice(0, 7);
const addMonths = (s, n) => { const d = parseYmd(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); return ymd(d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const monthStart = (s) => monthKey(s) + "-01";
const monthEnd = (s) => { const d = parseYmd(monthStart(s)); d.setMonth(d.getMonth() + 1); d.setDate(0); return ymd(d); };
const diffDays = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000);
function humanDate(s) {
  if (!s) return "—";
  const d = parseYmd(s), t = today();
  if (s === t) return "Bugun";
  if (s === addDays(t, -1)) return "Kecha";
  if (s === addDays(t, 1)) return "Ertaga";
  return d.getDate() + " " + MONTHS_SHORT[d.getMonth()].toLowerCase() + (d.getFullYear() !== new Date().getFullYear() ? " " + d.getFullYear() : "");
}
function longDate(s) { const d = parseYmd(s); return d.getDate() + " " + MONTHS[d.getMonth()].toLowerCase() + " " + d.getFullYear(); }
function monthLabel(mk) { const p = mk.split("-"); return MONTHS[+p[1] - 1] + " " + p[0]; }

/* ---------- 2. VALYUTA ---------- */
const CURRENCIES = {
  UZS: { name: "O'zbekiston so'mi", suffix: "so'm", dec: 0 },
  USD: { name: "AQSH dollari", suffix: "$", dec: 2 },
  EUR: { name: "Yevro", suffix: "€", dec: 2 },
  RUB: { name: "Rossiya rubli", suffix: "₽", dec: 2 },
  GBP: { name: "Funt sterling", suffix: "£", dec: 2 },
  KZT: { name: "Qozog'iston tengesi", suffix: "₸", dec: 2 }
};
function groupNum(n, dec) {
  const neg = n < 0; n = Math.abs(n);
  const fixed = dec ? n.toFixed(dec) : String(Math.round(n));
  const parts = fixed.split(".");
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return (neg ? "−" : "") + parts.join(",");
}
function fmt(n, cur, opt) {
  opt = opt || {};
  const c = CURRENCIES[cur || S.settings.currency] || CURRENCIES.UZS;
  const dec = opt.exact === false ? 0 : c.dec;
  const s = groupNum(n || 0, dec);
  if (opt.bare) return s;
  const sign = opt.sign && n > 0 ? "+" : "";
  return sign + s + " " + c.suffix;
}
function fmtShort(n, cur) {
  const c = CURRENCIES[cur || S.settings.currency] || CURRENCIES.UZS;
  const a = Math.abs(n);
  const sign = n < 0 ? "−" : "";
  if (a >= 1e9) return sign + (a / 1e9).toFixed(a >= 1e10 ? 0 : 1).replace(".", ",") + " mlrd";
  if (a >= 1e6) return sign + (a / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace(".", ",") + " mln";
  if (a >= 1e4) return sign + Math.round(a / 1e3) + " ming";
  return sign + groupNum(a, c.dec);
}
function parseAmount(v) {
  if (typeof v === "number") return v;
  const s = String(v || "").replace(/\s|\u00A0/g, "").replace(/,/g, ".");
  if (!s) return NaN;
  if (!/^-?\d*\.?\d*$/.test(s)) return NaN;
  return parseFloat(s);
}
/* asosiy valyutaga o'girish (qo'lda kiritilgan kurs bo'yicha) */
function toMain(amount, cur) {
  const main = S.settings.currency;
  if (!cur || cur === main) return amount;
  const r = (S.settings.rates || {})[cur];
  if (!r) return amount;
  return amount * r;
}

/* ---------- 4. SAQLASH QATLAMI (avtomatik, ko'p qatlamli) ----------
   Har bir o'zgarish bir vaqtning o'zida bir necha joyga yoziladi:
     1) localStorage      — eng tez, brauzer yopilsa ham qoladi
     2) IndexedDB         — kattaroq va ishonchliroq ombor
     3) window.storage    — mavjud bo'lsa (ilova qobig'i)
     4) Bog'langan fayl   — diskdagi haqiqiy .json fayl (Chrome/Edge)
   Yuklashda eng yangi nusxa (savedAt bo'yicha) tanlanadi.
------------------------------------------------------------------ */
const KEY = "moliyam-data-v1";
const KEY_MIRROR = "moliyam-data-mirror";

/* --- kichik IndexedDB yordamchisi --- */
const IDB = {
  ok: null, _p: null,
  db() {
    if (this._p) return this._p;
    this._p = new Promise((res, rej) => {
      let req;
      try { req = indexedDB.open("moliyam", 1); } catch (e) { return rej(e); }
      const t = setTimeout(() => rej(new Error("timeout")), 5000);
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains("kv")) d.createObjectStore("kv");
      };
      req.onsuccess = () => { clearTimeout(t); res(req.result); };
      req.onerror = () => { clearTimeout(t); rej(req.error || new Error("idb")); };
      req.onblocked = () => { clearTimeout(t); rej(new Error("blocked")); };
    });
    this._p.then(() => { IDB.ok = true; }, () => { IDB.ok = false; });
    return this._p;
  },
  async get(k) {
    const d = await this.db();
    return new Promise((res, rej) => {
      const r = d.transaction("kv", "readonly").objectStore("kv").get(k);
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  },
  async set(k, v) {
    const d = await this.db();
    return new Promise((res, rej) => {
      const tx = d.transaction("kv", "readwrite");
      tx.objectStore("kv").put(v, k);
      tx.oncomplete = () => res(true); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  },
  async del(k) {
    const d = await this.db();
    return new Promise((res, rej) => {
      const tx = d.transaction("kv", "readwrite");
      tx.objectStore("kv").delete(k);
      tx.oncomplete = () => res(true); tx.onerror = () => rej(tx.error);
    });
  }
};

const Vault = {
  file: null,          // bog'langan FileSystemFileHandle
  pendingFile: null,   // ruxsat kutayotgan handle
  fileName: "",
  lastSaved: null,
  lastSource: "",
  lastErr: "",
  busy: false,
  snaps: [],           // [{at, count, json}] — avtomatik ichki nusxalar
  supportsFile: !!(window.showSaveFilePicker),

  wrap(data) {
    return { app: "Moliyam", version: APP_VERSION, savedAt: new Date().toISOString(), data: data };
  },
  unwrap(obj) {
    if (!obj) return null;
    if (obj.data && (obj.savedAt || obj.app)) return { at: obj.savedAt || "", data: obj.data };
    if (obj.accounts || obj.transactions) return { at: obj.updatedAt || "", data: obj };   // eski format
    return null;
  },

  /* ---- ishga tushirish: barcha manbalardan eng yangisini olish ---- */
  async init() {
    /* brauzer ma'lumotni o'chirib yubormasligi uchun so'rov */
    try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) { }
    /* bog'langan fayl handle'ini tiklash */
    try {
      const h = await IDB.get("fileHandle");
      if (h && h.queryPermission) {
        const p = await h.queryPermission({ mode: "readwrite" });
        if (p === "granted") { this.file = h; this.fileName = h.name; }
        else { this.pendingFile = h; this.fileName = h.name; }
      }
    } catch (e) { }
    try { this.snaps = (await IDB.get("snaps")) || []; } catch (e) { this.snaps = []; }
  },

  async load() {
    const cands = [];
    const push = (src, obj) => { const u = this.unwrap(obj); if (u && u.data) cands.push({ src: src, at: u.at || "", data: u.data }); };
    /* 1 localStorage */
    try { push("Brauzer xotirasi", JSON.parse(localStorage.getItem(KEY) || "null")); } catch (e) { }
    try { push("Brauzer nusxasi", JSON.parse(localStorage.getItem(KEY_MIRROR) || "null")); } catch (e) { }
    /* 2 IndexedDB */
    try { push("IndexedDB", await IDB.get("state")); } catch (e) { }
    /* 3 window.storage */
    try {
      if (window.storage && window.storage.get) {
        const r = await window.storage.get(KEY);
        if (r && r.value) push("Ilova ombori", JSON.parse(r.value));
      }
    } catch (e) { }
    /* 4 bog'langan fayl */
    try {
      if (this.file) {
        const f = await this.file.getFile();
        const txt = await f.text();
        if (txt.trim()) push("Bog'langan fayl (" + this.fileName + ")", JSON.parse(txt));
      }
    } catch (e) { }
    if (!cands.length) return null;
    cands.sort((a, b) => (b.at || "").localeCompare(a.at || ""));
    this.lastSource = cands[0].src;
    return cands[0].data;
  },

  /* ---- saqlash: hamma qatlamga birdaniga ---- */
  async save(data) {
    const payload = this.wrap(data);
    const json = JSON.stringify(payload);
    let any = false; const errs = [];
    this.busy = true; this.paint();

    try { localStorage.setItem(KEY, json); localStorage.setItem(KEY_MIRROR, json); any = true; }
    catch (e) { errs.push("brauzer xotirasi to'lgan"); }

    try { await IDB.set("state", payload); any = true; } catch (e) { if (IDB.ok === false) errs.push("IndexedDB yopiq"); }

    try { if (window.storage && window.storage.set) { await window.storage.set(KEY, json); any = true; } } catch (e) { }

    if (this.file) {
      try {
        const w = await this.file.createWritable();
        await w.write(json); await w.close();
        any = true;
      } catch (e) { errs.push("faylga yozib bo'lmadi"); this.file = null; }
    }

    this.busy = false;
    this.lastErr = any ? "" : (errs[0] || "saqlanmadi");
    if (any) this.lastSaved = new Date();
    this.paint();
    this.snapshot(payload, data);
    this.dayFile(json);
    return any;
  },

  /* darhol, kutmasdan (sahifa yopilayotganda) */
  syncFlush(data) {
    try { localStorage.setItem(KEY, JSON.stringify(this.wrap(data))); return true; } catch (e) { return false; }
  },

  /* ---- avtomatik ichki nusxalar (oxirgi 12 ta) ---- */
  async snapshot(payload, data) {
    const now = Date.now();
    const last = this.snaps.length ? Date.parse(this.snaps[0].at) : 0;
    if (now - last < 5 * 60 * 1000) return;          // 5 daqiqada bir marta
    try {
      this.snaps.unshift({
        at: new Date().toISOString(),
        count: (data.transactions || []).length,
        json: JSON.stringify(payload)
      });
      this.snaps = this.snaps.slice(0, 12);
      await IDB.set("snaps", this.snaps);
    } catch (e) { this.snaps = this.snaps.slice(0, 3); }
  },

  /* ---- kuniga bir marta avtomatik fayl zaxirasi (fayl bog'lanmagan bo'lsa) ---- */
  dayFile(json) {
    try {
      if (this.file) return;                                  // fayl bor — kerak emas
      if (!S.settings || S.settings.autoFileBackup === false) return;
      if (ROLE === "operator") return;
      const d = today();
      if (S.settings.lastAutoBackup === d) return;
      S.settings.lastAutoBackup = d;
      download("moliyam-avto-zaxira-" + d + ".json", json, "application/json");
      toast("Kunlik avtomatik zaxira fayli yuklandi", "ok");
      try { localStorage.setItem(KEY, JSON.stringify(this.wrap(S))); } catch (e) { }
    } catch (e) { }
  },

  /* ---- holat ko'rsatkichi ---- */
  paint() {
    const el = document.getElementById("saveState");
    if (!el) return;
    let cls = "ok", txt = "Saqlandi", ic = "check";
    if (this.busy) { cls = "wait"; txt = "Saqlanmoqda…"; ic = "refresh"; }
    else if (this.lastErr) { cls = "bad"; txt = "Saqlanmadi"; ic = "alert"; }
    else if (this.lastSaved) txt = "Saqlandi " + hhmm(this.lastSaved);
    el.className = "save-pill " + cls;
    el.innerHTML = ico(ic, 14, 2.2) + "<span>" + txt + (this.file ? " · fayl" : "") + "</span>";
    el.title = this.lastErr ? "Saqlashda muammo: " + this.lastErr
      : (this.file ? "Ma'lumot " + this.fileName + " fayliga avtomatik yozilmoqda" : "Ma'lumot shu qurilmada avtomatik saqlanmoqda");
  }
};
function hhmm(d) { return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }

/* eski kod bilan moslik uchun */
const Store = {
  load: () => Vault.load(),
  save: (data) => Vault.save(data)
};

let S = blankState();
let dirty = false;
let booted = false;
async function persist() {
  if (!booted) return;
  dirty = true;
  Vault.busy = true; Vault.paint();
  Vault.syncFlush(S);                 /* darhol brauzer xotirasiga — hech narsa yo'qolmaydi */
  clearTimeout(persist._t);
  persist._t = setTimeout(async () => { await Vault.save(S); dirty = false; }, 150);
}
/* sahifa yopilishi / fonga o'tishi — kutmasdan yozamiz */
function flushNow() {
  if (!dirty) return;
  clearTimeout(persist._t);
  Vault.syncFlush(S);
  dirty = false;
  Vault.save(S);
}

/* ---------- 6. BILDIRISHNOMA VA OYNALAR ---------- */
function toast(msg, kind) {
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.innerHTML = (kind === "ok" ? ico("check", 17, 2.4) : kind === "bad" ? ico("alert", 17, 2.2) : "") + "<span>" + esc(msg) + "</span>";
  $("#toasts").appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .25s"; setTimeout(() => el.remove(), 260); }, 2600);
}
let modalStack = [];
function openModal(html, opts) {
  opts = opts || {};
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = '<div class="modal' + (opts.wide ? " wide" : "") + '" role="dialog" aria-modal="true">' + html + "</div>";
  $("#modals").appendChild(scrim);
  modalStack.push(scrim);
  scrim.addEventListener("mousedown", (e) => { if (e.target === scrim && !opts.sticky) closeModal(); });
  const first = scrim.querySelector("[data-autofocus]") || scrim.querySelector("input,select,textarea,button");
  if (first) setTimeout(() => first.focus(), 30);
  scrim.addEventListener("keydown", (e) => {
    if (e.key === "Tab") {
      const f = $$('a[href],button:not([disabled]),input:not([type=hidden]),select,textarea,[tabindex]:not([tabindex="-1"])', scrim).filter(x => x.offsetParent !== null);
      if (!f.length) return;
      const i = f.indexOf(document.activeElement);
      if (e.shiftKey && (i <= 0)) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
    }
  });
  return scrim;
}
function closeModal() { const m = modalStack.pop(); if (m) m.remove(); }
function closeAllModals() { while (modalStack.length) closeModal(); }
function confirmDlg(o) {
  return new Promise((res) => {
    const scrim = openModal(
      '<div class="modal-head"><h2>' + esc(o.title) + "</h2></div>" +
      '<div class="modal-body"><p style="margin:0;color:var(--ink-2)">' + o.text + "</p></div>" +
      '<div class="modal-foot"><button class="btn" data-no>Bekor qilish</button>' +
      '<button class="btn ' + (o.danger ? "btn-danger" : "btn-primary") + '" data-yes data-autofocus>' + esc(o.ok || "Tasdiqlash") + "</button></div>", { sticky: false });
    scrim.querySelector("[data-no]").onclick = () => { closeModal(); res(false); };
    scrim.querySelector("[data-yes]").onclick = () => { closeModal(); res(true); };
  });
}
/* Tasdiq + "bog'liq yozuv ham qaytarilsinmi" belgisi */
function confirmRevert(o) {
  return new Promise((res) => {
    const scrim = openModal(
      '<div class="modal-head"><h2>' + esc(o.title) + "</h2></div>" +
      '<div class="modal-body"><p style="margin:0 0 6px;color:var(--ink-2)">' + o.text + "</p>" +
      '<label class="set-row" style="border:0;margin-top:6px"><input type="checkbox" id="revChk"' + (o.checked === false ? "" : " checked") + ">" +
      '<span class="t"><b>' + esc(o.checkLabel) + "</b>" + (o.checkHint ? "<span>" + esc(o.checkHint) + "</span>" : "") + "</span></label></div>" +
      '<div class="modal-foot"><button class="btn" data-no>Bekor qilish</button>' +
      '<button class="btn btn-danger" data-yes data-autofocus>' + esc(o.ok || "O'chirish") + "</button></div>");
    const chk = () => { const c = scrim.querySelector("#revChk"); return !!(c && c.checked); };
    scrim.querySelector("[data-no]").onclick = () => { closeModal(); res({ ok: false, revert: false }); };
    scrim.querySelector("[data-yes]").onclick = () => { const r = chk(); closeModal(); res({ ok: true, revert: r }); };
  });
}
function modalHead(title, sub) {
  return '<div class="modal-head"><div><h2>' + esc(title) + "</h2>" + (sub ? '<div class="small muted">' + esc(sub) + "</div>" : "") +
    '</div><button class="icon-btn" onclick="closeModal()" aria-label="Yopish">' + ico("x", 17) + "</button></div>";
}

<script>
"use strict";
/* ============================================================
   7. HISOB-KITOB QATLAMI (biznes mantiq)
   Qoidalar:
   - Balans = boshlang'ich qoldiq + kirim − chiqim + kirish o'tkazmalari − chiqish o'tkazmalari
   - O'tkazma daromad ham, xarajat ham emas (umumiy boylikni o'zgartirmaydi)
   - kind: "normal" (statistikaga kiradi) | "debt" | "goal" (faqat balansga ta'sir qiladi)
   ============================================================ */
const Calc = {
  account: (id) => S.accounts.find(a => a.id === id),
  category: (id) => S.categories.find(c => c.id === id),

  accountBalance(id) {
    const a = Calc.account(id); if (!a) return 0;
    let b = a.initial || 0;
    for (const t of S.transactions) {
      if (t.type === "income" && t.accountId === id) b += t.amount;
      else if (t.type === "expense" && t.accountId === id) b -= t.amount;
      else if (t.type === "transfer") {
        if (t.accountId === id) b -= t.amount;
        if (t.toAccountId === id) b += (t.toAmount != null ? t.toAmount : t.amount);
      }
    }
    return b;
  },
  /* Berilgan sana oxiridagi umumiy balans (asosiy valyutada) */
  balanceAsOf(date) {
    const live = {};
    S.accounts.forEach(a => { if (!a.archived) live[a.id] = a; });
    let b = 0;
    for (const id in live) b += toMain(live[id].initial || 0, live[id].currency);
    for (const t of S.transactions) {
      if (t.date > date) continue;
      const a = live[t.accountId], to = live[t.toAccountId];
      if (t.type === "income" && a) b += toMain(t.amount, a.currency);
      else if (t.type === "expense" && a) b -= toMain(t.amount, a.currency);
      else if (t.type === "transfer") {
        if (a) b -= toMain(t.amount, a.currency);
        if (to) b += toMain(t.toAmount != null ? t.toAmount : t.amount, to.currency);
      }
    }
    return b;
  },
  totalBalance() {
    return S.accounts.filter(a => !a.archived).reduce((s, a) => s + toMain(Calc.accountBalance(a.id), a.currency), 0);
  },
  /* Operatsiya summasini asosiy valyutaga o'girish */
  main(t) { const a = Calc.account(t.accountId); return toMain(t.amount, a ? a.currency : S.settings.currency); },

  range(from, to, opt) {
    opt = opt || {};
    return S.transactions.filter(t => t.date >= from && t.date <= to && (opt.all || (t.kind || "normal") === "normal"));
  },
  sums(list) {
    let inc = 0, exp = 0;
    for (const t of list) {
      if (t.type === "income") inc += Calc.main(t);
      else if (t.type === "expense") exp += Calc.main(t);
    }
    return { income: inc, expense: exp, net: inc - exp };
  },
  monthSums(mk) { return Calc.sums(Calc.range(mk + "-01", monthEnd(mk + "-01"))); },

  byCategory(list, type) {
    const map = {};
    for (const t of list) {
      if (t.type !== type) continue;
      const key = t.categoryId || "none";
      map[key] = (map[key] || 0) + Calc.main(t);
    }
    return Object.keys(map).map(id => {
      const c = Calc.category(id);
      return { id, name: c ? c.name : "Kategoriyasiz", icon: c ? c.icon : "📌", color: c ? c.color : "#7C939C", value: map[id] };
    }).sort((a, b) => b.value - a.value);
  },

  /* --- Qarzlar ---
     Umumiy qarz = boshlang'ich summa + keyin qo'shilgan summalar
     Yopilgan qism = naqd to'lovlar + chegirmalar (kechirilgan summa) */
  debtTotal: (d) => (d.amount || 0) + (d.increases || []).reduce((s, i) => s + i.amount, 0),
  debtPaid: (d) => (d.payments || []).reduce((s, p) => s + p.amount, 0),
  debtDiscount: (d) => (d.payments || []).reduce((s, p) => s + (p.discount || 0), 0),
  debtCovered: (d) => Calc.debtPaid(d) + Calc.debtDiscount(d),
  debtLeft: (d) => Math.max(0, Calc.debtTotal(d) - Calc.debtCovered(d)),
  debtStatus(d) {
    const left = Calc.debtLeft(d);
    if (left <= 0.0001) return { key: "closed", label: Calc.debtDiscount(d) > 0 ? "Chegirma bilan yopilgan" : "To'liq qaytarilgan", cls: "up" };
    if (d.due && d.due < today()) return { key: "overdue", label: "Muddati o'tgan", cls: "down" };
    if (Calc.debtCovered(d) > 0) return { key: "partial", label: "Qisman qaytarilgan", cls: "warn" };
    return { key: "active", label: "Faol", cls: "neutral" };
  },
  debtTotals() {
    let given = 0, taken = 0, overdue = 0;
    for (const d of S.debts) {
      const left = Calc.debtLeft(d);
      if (left <= 0) continue;
      if (Calc.debtStatus(d).key === "overdue") overdue++;
      const v = toMain(left, d.currency);
      if (d.dir === "given") given += v; else taken += v;
    }
    return { given, taken, overdue, net: given - taken };
  },

  /* --- Byudjet --- */
  budgetSpent(b, mk) {
    mk = mk || monthKey(today());
    const list = Calc.range(mk + "-01", monthEnd(mk + "-01"));
    let s = 0;
    for (const t of list) {
      if (t.type !== "expense") continue;
      if (b.categoryId && t.categoryId !== b.categoryId) continue;
      s += Calc.main(t);
    }
    return s;
  },
  budgetState(b, mk) {
    const spent = Calc.budgetSpent(b, mk);
    const pct = b.amount > 0 ? (spent / b.amount) * 100 : 0;
    const cls = pct >= 100 ? "over" : pct >= 80 ? "warn" : "ok";
    return { spent, left: b.amount - spent, pct, cls };
  },

  /* --- Maqsadlar --- */
  goalSaved: (g) => (g.contributions || []).reduce((s, c) => s + c.amount, 0),
  goalPct: (g) => g.target > 0 ? clamp((Calc.goalSaved(g) / g.target) * 100, 0, 100) : 0,

  /* --- Takroriy operatsiyalar --- */
  nextDate(date, freq) {
    if (freq === "daily") return addDays(date, 1);
    if (freq === "weekly") return addDays(date, 7);
    if (freq === "yearly") { const d = parseYmd(date); d.setFullYear(d.getFullYear() + 1); return ymd(d); }
    return addMonths(date, 1);
  },
  runRecurring() {
    let made = 0;
    const t = today();
    for (const r of S.recurring) {
      if (!r.active) continue;
      let guard = 0;
      while (r.nextDate <= t && guard++ < 400) {
        S.transactions.push({
          id: uid(), type: r.type, kind: "normal", amount: r.amount,
          accountId: r.accountId, toAccountId: r.toAccountId || null,
          categoryId: r.categoryId || null, date: r.nextDate, time: r.time || "09:00",
          note: r.note || r.name, tags: [], recurringId: r.id, createdAt: new Date().toISOString()
        });
        r.nextDate = Calc.nextDate(r.nextDate, r.freq);
        made++;
      }
    }
    if (made) persist();
    return made;
  },

  /* --- Aqlli tahlil --- */
  insights() {
    const out = [];
    const mk = monthKey(today()), pk = monthKey(addMonths(today(), -1));
    const cur = Calc.monthSums(mk), prev = Calc.monthSums(pk);
    if (cur.income || cur.expense) {
      if (cur.net >= 0) out.push({ icon: "🟢", tone: "up", text: "Bu oy daromadingiz xarajatlaringizdan <b>" + fmt(cur.net) + "</b> ko'p. Shu sur'atda davom eting." });
      else out.push({ icon: "🔴", tone: "down", text: "Bu oy xarajatingiz daromadingizdan <b>" + fmt(-cur.net) + "</b> ko'p. Qaysi kategoriyani qisqartirish mumkinligini ko'rib chiqing." });
    }
    const curCats = Calc.byCategory(Calc.range(mk + "-01", monthEnd(mk + "-01")), "expense");
    const prevCats = Calc.byCategory(Calc.range(pk + "-01", monthEnd(pk + "-01")), "expense");
    if (curCats[0]) out.push({ icon: "📊", tone: "neutral", text: "Eng katta xarajat — <b>" + esc(curCats[0].name) + "</b>: " + fmt(curCats[0].value) + " (" + Math.round(curCats[0].value / (cur.expense || 1) * 100) + "%)." });
    for (const c of curCats.slice(0, 6)) {
      const p = prevCats.find(x => x.id === c.id);
      if (p && p.value > 0) {
        const ch = Math.round((c.value - p.value) / p.value * 100);
        if (ch >= 20) { out.push({ icon: "⬆️", tone: "down", text: "<b>" + esc(c.name) + "</b> xarajatlaringiz o'tgan oyga nisbatan <b>" + ch + "%</b> oshgan." }); break; }
        if (ch <= -20) { out.push({ icon: "⬇️", tone: "up", text: "<b>" + esc(c.name) + "</b> xarajatlaringiz o'tgan oyga nisbatan <b>" + Math.abs(ch) + "%</b> kamaygan." }); break; }
      }
    }
    for (const b of S.budgets) {
      const st = Calc.budgetState(b);
      if (st.pct >= 100) { out.push({ icon: "⚠️", tone: "down", text: "<b>" + esc(Calc.budgetName(b)) + "</b> byudjeti " + Math.round(st.pct) + "% ga yetdi — limitdan " + fmt(-st.left) + " oshib ketdi." }); break; }
      if (st.pct >= 80) { out.push({ icon: "⚠️", tone: "warn", text: "<b>" + esc(Calc.budgetName(b)) + "</b> byudjetingizning " + Math.round(st.pct) + "% qismi ishlatilgan." }); break; }
    }
    const dt = Calc.debtTotals();
    if (dt.overdue) out.push({ icon: "⏰", tone: "down", text: "<b>" + dt.overdue + " ta</b> qarzning muddati o'tib ketgan." });
    else if (dt.given > 0) out.push({ icon: "🤝", tone: "neutral", text: "Sizga qaytarilishi kerak bo'lgan summa — <b>" + fmt(dt.given) + "</b>." });
    const days = new Date().getDate();
    if (cur.expense > 0) out.push({ icon: "📅", tone: "neutral", text: "Bu oy kuniga o'rtacha <b>" + fmt(cur.expense / days) + "</b> sarflayapsiz." });
    const g = S.goals.map(x => ({ g: x, p: Calc.goalPct(x) })).filter(x => x.p < 100).sort((a, b) => b.p - a.p)[0];
    if (g) out.push({ icon: "🎯", tone: "up", text: "<b>" + esc(g.g.name) + "</b> maqsadi " + Math.round(g.p) + "% bajarildi, yana " + fmt(g.g.target - Calc.goalSaved(g.g)) + " kerak." });
    return out.slice(0, 6);
  },
  budgetName(b) {
    if (b.name) return b.name;
    const c = Calc.category(b.categoryId);
    return c ? c.name : "Umumiy oylik byudjet";
  }
};

/* ============================================================
   8. DIAGRAMMALAR (tashqi kutubxonasiz, sof SVG)
   ============================================================ */
const Chart = {
  bars(data, opt) {
    opt = opt || {};
    const W = 640, H = opt.height || 210, padL = 8, padB = 26, padT = 12;
    const max = Math.max(1, ...data.map(d => Math.max(d.a || 0, d.b || 0)));
    const n = data.length || 1;
    const step = (W - padL * 2) / n;
    const bw = Math.min(20, step / 3.1);
    let g = "";
    for (let i = 0; i <= 3; i++) {
      const y = padT + (H - padT - padB) * (i / 3);
      g += '<line class="gl" x1="0" y1="' + y.toFixed(1) + '" x2="' + W + '" y2="' + y.toFixed(1) + '"/>';
      g += '<text x="2" y="' + (y - 4).toFixed(1) + '">' + fmtShort(max * (1 - i / 3)) + "</text>";
    }
    data.forEach((d, i) => {
      const cx = padL + step * i + step / 2;
      const ha = (H - padT - padB) * ((d.a || 0) / max), hb = (H - padT - padB) * ((d.b || 0) / max);
      const y0 = H - padB;
      g += '<rect x="' + (cx - bw - 2).toFixed(1) + '" y="' + (y0 - ha).toFixed(1) + '" width="' + bw + '" height="' + Math.max(0, ha).toFixed(1) + '" rx="4" fill="var(--up)"><title>' + esc(d.label) + " — kirim: " + fmt(d.a || 0) + "</title></rect>";
      g += '<rect x="' + (cx + 2).toFixed(1) + '" y="' + (y0 - hb).toFixed(1) + '" width="' + bw + '" height="' + Math.max(0, hb).toFixed(1) + '" rx="4" fill="var(--down)"><title>' + esc(d.label) + " — chiqim: " + fmt(d.b || 0) + "</title></rect>";
      g += '<text x="' + cx.toFixed(1) + '" y="' + (H - 7) + '" text-anchor="middle">' + esc(d.label) + "</text>";
    });
    return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" role="img" aria-label="Kirim va chiqim diagrammasi">' + g + "</svg>";
  },
  donut(items, opt) {
    opt = opt || {};
    const size = 190, r = 74, cx = size / 2, cy = size / 2, sw = 26;
    const total = items.reduce((s, i) => s + i.value, 0);
    if (!total) return '<svg class="chart" viewBox="0 0 ' + size + " " + size + '"><circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--line-2)" stroke-width="' + sw + '"/></svg>';
    let a0 = -Math.PI / 2, g = "";
    items.forEach(it => {
      const a1 = a0 + (it.value / total) * Math.PI * 2;
      const large = (a1 - a0) > Math.PI ? 1 : 0;
      const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
      const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
      g += '<path d="M' + x0.toFixed(2) + " " + y0.toFixed(2) + " A" + r + " " + r + " 0 " + large + " 1 " + x1.toFixed(2) + " " + y1.toFixed(2) +
        '" fill="none" stroke="' + it.color + '" stroke-width="' + sw + '" stroke-linecap="butt"><title>' + esc(it.name) + " — " + fmt(it.value) + " (" + Math.round(it.value / total * 100) + "%)</title></path>";
      a0 = a1;
    });
    g += '<text x="' + cx + '" y="' + (cy - 2) + '" text-anchor="middle" style="font-size:12px;fill:var(--ink-3)">' + esc(opt.label || "Jami") + "</text>";
    g += '<text x="' + cx + '" y="' + (cy + 18) + '" text-anchor="middle" style="font-size:15px;font-weight:700;fill:var(--ink)">' + fmtShort(total) + "</text>";
    return '<svg class="chart" viewBox="0 0 ' + size + " " + size + '" style="max-height:200px" role="img" aria-label="Kategoriya ulushlari">' + g + "</svg>";
  },
  area(points, opt) {
    opt = opt || {};
    const W = 640, H = opt.height || 190, padT = 14, padB = 24;
    if (!points.length) return "";
    const vals = points.map(p => p.v);
    const max = Math.max(...vals, 0), min = Math.min(...vals, 0);
    const span = (max - min) || 1;
    const x = i => (W / Math.max(1, points.length - 1)) * i;
    const y = v => padT + (H - padT - padB) * (1 - (v - min) / span);
    let d = "", area = "";
    points.forEach((p, i) => { const cmd = i ? "L" : "M"; d += cmd + x(i).toFixed(1) + " " + y(p.v).toFixed(1) + " "; });
    area = d + "L" + x(points.length - 1).toFixed(1) + " " + y(min).toFixed(1) + " L0 " + y(min).toFixed(1) + " Z";
    const zero = y(0);
    let g = '<line class="gl" x1="0" y1="' + zero.toFixed(1) + '" x2="' + W + '" y2="' + zero.toFixed(1) + '"/>';
    g += '<defs><linearGradient id="ag" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--teal-500)" stop-opacity=".35"/><stop offset="1" stop-color="var(--teal-500)" stop-opacity="0"/></linearGradient></defs>';
    g += '<path d="' + area + '" fill="url(#ag)"/>';
    g += '<path d="' + d + '" fill="none" stroke="var(--teal-500)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
    points.forEach((p, i) => {
      g += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="3.4" fill="var(--panel)" stroke="var(--teal-500)" stroke-width="2"><title>' + esc(p.label) + ": " + fmt(p.v) + "</title></circle>";
      if (points.length <= 14 || i % 2 === 0) g += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="' + (i === 0 ? "start" : i === points.length - 1 ? "end" : "middle") + '">' + esc(p.label) + "</text>";
    });
    return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" role="img" aria-label="Sof pul oqimi">' + g + "</svg>";
  },
  hbars(items, opt) {
    opt = opt || {};
    const max = Math.max(1, ...items.map(i => i.value));
    return items.map(i => (
      '<div style="margin-bottom:12px">' +
      '<div style="display:flex;gap:8px;align-items:center;font-size:13.5px;margin-bottom:5px">' +
      '<span class="dot" style="background:' + i.color + '"></span><span>' + esc(i.name) + "</span>" +
      '<b class="num" style="margin-left:auto">' + fmt(i.value) + "</b></div>" +
      '<div class="bar"><i style="width:' + (i.value / max * 100).toFixed(1) + "%;background:" + i.color + '"></i></div></div>'
    )).join("");
  }
};
</script>
<script>
"use strict";
/* ============================================================
   9. KO'RINISH QATLAMI — karkas, marshrutlash, bosh sahifa
   ============================================================ */
const UI = {
  route: "dashboard",
  txFilter: { q: "", type: "all", cat: "all", acc: "all", from: "", to: "", sort: "date-desc", page: 1, per: 40 },
  debtTab: "given",
  shopRange: "month",
  statRange: "month",
  statFrom: "", statTo: "",
  reportMonth: monthKey(today()),
  reportTab: "month",
  reportDay: today()
};
const ROUTES = [
  { id: "dashboard", label: "Bosh sahifa", icon: "home", group: "Umumiy" },
  { id: "transactions", label: "Operatsiyalar", icon: "swap", group: "Umumiy" },
  { id: "accounts", label: "Hisoblar", icon: "wallet", group: "Umumiy" },
  { id: "debts", label: "Qarzlar", icon: "users", group: "Rejalashtirish" },
  { id: "shop", label: "Magazin", icon: "archive", group: "Rejalashtirish" },
  { id: "credits", label: "Kredit", icon: "bank", group: "Rejalashtirish" },
  { id: "budgets", label: "Byudjet", icon: "pie", group: "Rejalashtirish" },
  { id: "goals", label: "Maqsadlar", icon: "target", group: "Rejalashtirish" },
  { id: "recurring", label: "Takroriy to'lovlar", icon: "refresh", group: "Rejalashtirish" },
  { id: "stats", label: "Statistika", icon: "chart", group: "Tahlil" },
  { id: "reports", label: "Hisobotlar", icon: "file", group: "Tahlil" },
  { id: "settings", label: "Sozlamalar", icon: "gear", group: "Tahlil" }
];
/* Rollar: admin — hamma bo'lim; operator — faqat Qarzlar va Magazin */
let ROLE = "admin";
const OPERATOR_ROUTES = ["debts", "shop"];
const canSee = (id) => ROLE !== "operator" || OPERATOR_ROUTES.indexOf(id) > -1;
function applyRole() {
  const op = ROLE === "operator";
  const fab = $("#fab"); if (fab) fab.hidden = op;
  const b = $("#backupBtn"); if (b) b.hidden = op;
  const i = $("#importBtn"); if (i) i.hidden = op;
  const lock = $("#lockBtn"); if (lock) lock.hidden = !(S.settings.pin || S.settings.operatorPin);
  const ver = $("#verLbl"); if (ver) ver.innerHTML = op ? '<span class="pill warn">Operator</span>' : "v" + APP_VERSION;
  if (!canSee(UI.route)) UI.route = op ? OPERATOR_ROUTES[0] : "dashboard";
}
function renderNav() {
  let html = "", lastGroup = "";
  const overdue = S.debts.filter(d => Calc.debtLeft(d) > 0 && Calc.debtStatus(d).key === "overdue").length;
  const credAlerts = (typeof Credit !== "undefined" ? Credit.alerts() : []).length;
  for (const r of ROUTES) {
    if (!canSee(r.id)) continue;
    if (r.group !== lastGroup) { html += '<div class="nav-group">' + r.group + "</div>"; lastGroup = r.group; }
    const badge = r.id === "debts" && overdue ? '<span class="badge">' + overdue + "</span>"
      : r.id === "credits" && credAlerts ? '<span class="badge">' + credAlerts + "</span>" : "";
    html += '<button class="nav-item' + (UI.route === r.id ? " on" : "") + '" onclick="go(\'' + r.id + '\')" ' +
      (UI.route === r.id ? 'aria-current="page"' : "") + ">" + ico(r.icon) + "<span>" + r.label + "</span>" + badge + "</button>";
  }
  $("#nav").innerHTML = html;
}
function go(route) {
  if (!canSee(route)) { toast("Bu bo'lim operator uchun yopiq", "bad"); return; }
  UI.route = route;
  if (route !== "transactions") UI.txFilter.page = 1;
  renderNav();
  render();
  $("#view").scrollTop = 0;
  $("#side").classList.remove("open");
}
function render() {
  if (!canSee(UI.route)) UI.route = OPERATOR_ROUTES[0];
  const v = Views[UI.route];
  $("#view").innerHTML = v ? v() : "";
  if (Views[UI.route + "After"]) Views[UI.route + "After"]();
}
function head(title, sub, actions) {
  return '<div class="view-head"><div><h1>' + esc(title) + "</h1>" + (sub ? "<p>" + esc(sub) + "</p>" : "") + "</div>" +
    (actions ? '<div style="display:flex;gap:9px;flex-wrap:wrap">' + actions + "</div>" : "") + "</div>";
}
function emptyState(icon, title, text, btn) {
  return '<div class="empty"><div class="ic">' + ico(icon, 28, 1.6) + "</div><h3>" + esc(title) + "</h3><p>" + esc(text) + "</p>" + (btn || "") + "</div>";
}
function accSelect(name, value, extra) {
  return '<select class="input" name="' + name + '" ' + (extra || "") + ">" +
    S.accounts.filter(a => !a.archived).map(a => '<option value="' + a.id + '"' + (a.id === value ? " selected" : "") + ">" +
      esc(a.name) + " · " + fmt(Calc.accountBalance(a.id), a.currency) + "</option>").join("") + "</select>";
}
function catChips(type, value) {
  return S.categories.filter(c => c.type === type && !c.archived).map(c =>
    '<button type="button" class="chip' + (c.id === value ? " on" : "") + '" data-cat="' + c.id + '" onclick="pickCat(this)">' +
    '<span style="font-size:15px">' + c.icon + "</span>" + esc(c.name) + "</button>").join("");
}
function pickCat(el) {
  $$(".chip[data-cat]", el.parentElement).forEach(x => x.classList.remove("on"));
  el.classList.add("on");
  const f = el.closest("form"); if (f) f.dataset.cat = el.dataset.cat;
}
function fmtAmountInput(el) {
  const caretEnd = el.selectionStart === el.value.length;
  let v = el.value.replace(/[^\d.,]/g, "");
  const parts = v.replace(/,/g, ".").split(".");
  let intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  el.value = intPart + (parts.length > 1 ? "," + parts.slice(1).join("").slice(0, 2) : "");
  if (caretEnd) el.selectionStart = el.selectionEnd = el.value.length;
}
function typeIcon(t) {
  if (t.type === "income") return '<span class="tint" style="background:var(--up-soft);color:var(--up)">' + ico("arrowIn", 17, 2) + "</span>";
  if (t.type === "expense") return '<span class="tint" style="background:var(--down-soft);color:var(--down)">' + ico("arrowOut", 17, 2) + "</span>";
  return '<span class="tint" style="background:var(--panel-2);color:var(--ink-2)">' + ico("swap", 17, 2) + "</span>";
}
function txnTitle(t) {
  if (t.type === "transfer") {
    const a = Calc.account(t.accountId), b = Calc.account(t.toAccountId);
    return "O'tkazma: " + (a ? a.name : "?") + " → " + (b ? b.name : "?");
  }
  const c = Calc.category(t.categoryId);
  return c ? c.name : "Kategoriyasiz";
}
function amtCell(t) {
  const a = Calc.account(t.accountId);
  const cur = a ? a.currency : S.settings.currency;
  if (t.type === "income") return '<span class="amt in">+' + fmt(t.amount, cur) + "</span>";
  if (t.type === "expense") return '<span class="amt out">−' + fmt(t.amount, cur) + "</span>";
  return '<span class="amt tr">' + fmt(t.amount, cur) + "</span>";
}

/* ---------- BOSH SAHIFA ---------- */
const Views = {};
Views.dashboard = function () {
  if (!S.accounts.length) {
    return head("Bosh sahifa", "Moliyaviy nazoratni hisob yaratishdan boshlang") +
      '<div class="card">' + emptyState("wallet", "Hozircha hisob mavjud emas",
        "Naqd pul, karta yoki bank hisobini qo'shing — shundan keyin operatsiyalarni yozib borishingiz mumkin.",
        '<button class="btn btn-primary" onclick="accountModal()">+ Birinchi hisobni qo\'shish</button>') + "</div>";
  }
  const mk = monthKey(today()), pk = monthKey(addMonths(today(), -1));
  const cur = Calc.monthSums(mk), prev = Calc.monthSums(pk);
  const allSums = Calc.sums(S.transactions.filter(t => (t.kind || "normal") === "normal"));
  const dt = Calc.debtTotals();
  const hide = S.settings.hideBalance;
  const mask = (v) => hide ? "••••••" : v;
  const chg = (c, p) => {
    if (!p) return '<span class="pill neutral">yangi</span>';
    const d = Math.round((c - p) / p * 100);
    if (d === 0) return '<span class="pill neutral">o\'zgarishsiz</span>';
    return '<span class="pill ' + (d > 0 ? "up" : "down") + '">' + (d > 0 ? "+" : "−") + Math.abs(d) + "%</span>";
  };

  /* oxirgi 6 oy */
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const k = monthKey(addMonths(today(), -i));
    const s = Calc.monthSums(k);
    months.push({ label: MONTHS_SHORT[+k.split("-")[1] - 1], a: s.income, b: s.expense, net: s.net, key: k });
  }
  const cats = Calc.byCategory(Calc.range(mk + "-01", monthEnd(mk + "-01")), "expense").slice(0, 7);
  const recent = S.transactions.slice().sort((a, b) => (b.date + (b.time || "")).localeCompare(a.date + (a.time || ""))).slice(0, 7);
  const ins = Calc.insights();

  return head("Bosh sahifa", longDate(today()) + " · " + WEEKDAYS[new Date().getDay()],
    '<button class="btn" onclick="go(\'reports\')">' + ico("file", 16) + " Hisobot</button>" +
    '<button class="btn btn-primary" onclick="txnModal()">' + ico("plus", 16, 2.4) + " Operatsiya qo'shish</button>") +

    '<div class="grid g-32" style="margin-bottom:16px">' +
      '<div class="hero">' +
        '<button class="eye icon-btn" style="border:0;background:rgba(255,255,255,.14)" onclick="toggleHide()" aria-label="Balansni yashirish">' + ico(hide ? "eyeOff" : "eye", 17) + "</button>" +
        '<div class="lbl">Joriy balans</div>' +
        '<div class="big num">' + mask(fmt(Calc.totalBalance(), null, { bare: true })) + '<span class="cur">' + CURRENCIES[S.settings.currency].suffix + "</span></div>" +
        '<div class="hero-row">' +
          '<div><span>Bu oy kirim</span><b class="num">' + mask(fmtShort(cur.income)) + "</b></div>" +
          '<div><span>Bu oy chiqim</span><b class="num">' + mask(fmtShort(cur.expense)) + "</b></div>" +
          '<div><span>Sof pul oqimi</span><b class="num">' + mask((cur.net >= 0 ? "+" : "") + fmtShort(cur.net)) + "</b></div>" +
          '<div><span>Hisoblar</span><b class="num">' + S.accounts.filter(a => !a.archived).length + " ta</b></div>" +
        "</div>" +
      "</div>" +
      '<div class="card card-pad">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><h3 style="font-size:15px">Hisoblar</h3>' +
        '<button class="btn btn-sm btn-ghost" onclick="go(\'accounts\')">Barchasi</button></div>' +
        S.accounts.filter(a => !a.archived).slice(0, 4).map(a =>
          '<div style="display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid var(--line-2)">' +
          '<span class="tint" style="background:' + a.color + '22;color:' + a.color + '">' + a.icon + "</span>" +
          '<div style="min-width:0"><div style="font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(a.name) + "</div>" +
          '<div class="small muted">' + (ACCOUNT_TYPES[a.type]||ACCOUNT_TYPES.other).label + "</div></div>" +
          '<b class="num" style="margin-left:auto;font-size:14.5px">' + mask(fmt(Calc.accountBalance(a.id), a.currency)) + "</b></div>").join("") +
      "</div>" +
    "</div>" +

    '<div class="grid g-4" style="margin-bottom:16px">' +
      '<div class="card stat"><div class="t">' + ico("arrowIn", 16) + "Jami kirim</div><div class=\"v num\" style=\"color:var(--up)\">" + mask(fmt(allSums.income)) + '</div><div class="d">Butun davr uchun</div></div>' +
      '<div class="card stat"><div class="t">' + ico("arrowOut", 16) + "Jami chiqim</div><div class=\"v num\" style=\"color:var(--down)\">" + mask(fmt(allSums.expense)) + '</div><div class="d">Butun davr uchun</div></div>' +
      '<div class="card stat"><div class="t">' + ico("chart", 16) + 'Bu oy sof oqimi</div><div class="v num">' + mask(fmt(cur.net)) + '</div><div class="d">O\'tgan oy: ' + fmtShort(prev.net) + " " + chg(cur.net, prev.net) + "</div></div>" +
      '<div class="card stat"><div class="t">' + ico("users", 16) + 'Qarz balansi</div><div class="v num">' + mask(fmt(dt.net)) + '</div><div class="d">Olinadigan ' + fmtShort(dt.given) + " · Beriladigan " + fmtShort(dt.taken) + "</div></div>" +
    "</div>" +

    '<div class="grid g-32" style="margin-bottom:16px">' +
      '<div class="card"><div class="card-head"><h3>Kirim va chiqim</h3><span class="sub">Oxirgi 6 oy</span></div>' +
      '<div class="card-pad">' + Chart.bars(months) +
      '<div style="display:flex;gap:18px;justify-content:center;margin-top:10px;font-size:13px">' +
      '<span style="display:flex;align-items:center;gap:6px"><i class="dot" style="background:var(--up)"></i>Kirim</span>' +
      '<span style="display:flex;align-items:center;gap:6px"><i class="dot" style="background:var(--down)"></i>Chiqim</span></div></div></div>' +

      '<div class="card-pad">' + (cats.length ?
        '<div style="display:grid;grid-template-columns:190px 1fr;gap:16px;align-items:center">' + Chart.donut(cats, { label: "Chiqim" }) +
        '<div class="legend">' + cats.slice(0, 6).map(c => '<div class="li"><i class="dot" style="background:' + c.color + '"></i>' + esc(c.name) + "<b>" + fmtShort(c.value) + "</b></div>").join("") + "</div></div>"
        : '<p class="muted small" style="text-align:center;padding:34px 0;margin:0">Bu oyda hali xarajat qayd etilmagan.</p>') + "</div></div>" +
    "</div>" +

    '<div class="grid g-23">' +
      '<div class="card"><div class="card-head"><h3>Moliyaviy tavsiyalar</h3><span class="sub">Sizning ma\'lumotlaringiz asosida</span></div>' +
      '<div class="card-pad" style="padding-top:4px">' + (ins.length ? ins.map(i =>
        '<div class="insight"><span class="tint" style="background:var(--panel-2)">' + i.icon + "</span><p>" + i.text + "</p></div>").join("")
        : '<p class="muted small">Tavsiyalar uchun bir nechta operatsiya kiriting.</p>') + "</div></div>" +
      '<div class="card"><div class="card-head"><h3>So\'nggi operatsiyalar</h3>' +
      '<button class="btn btn-sm btn-ghost" onclick="go(\'transactions\')">Barchasi</button></div>' +
      (recent.length ? '<table><tbody>' + recent.map(t =>
        '<tr onclick="txnModal(\'' + t.id + '\')" style="cursor:pointer"><td style="width:52px">' + typeIcon(t) + "</td>" +
        "<td><div style=\"font-weight:600\">" + esc(txnTitle(t)) + '</div><div class="small muted">' + humanDate(t.date) + (t.note ? " · " + esc(t.note) : "") + "</div></td>" +
        "<td>" + amtCell(t) + "</td></tr>").join("") + "</tbody></table>"
        : emptyState("swap", "Hozircha operatsiyalar mavjud emas", "Birinchi kirim yoki chiqimingizni yozib qo'ying.",
          '<button class="btn btn-primary" onclick="txnModal()">+ Birinchi operatsiyani qo\'shish</button>')) + "</div>" +
    "</div>";
};
function toggleHide() { S.settings.hideBalance = !S.settings.hideBalance; persist(); render(); }
</script>
<script>
"use strict";
/* ============================================================
   10. OPERATSIYALAR
   ============================================================ */
function filteredTxns() {
  const f = UI.txFilter;
  const q = f.q.trim().toLowerCase();
  let list = S.transactions.filter(t => {
    if (f.type !== "all" && t.type !== f.type) return false;
    if (f.cat !== "all" && t.categoryId !== f.cat) return false;
    if (f.acc !== "all" && t.accountId !== f.acc && t.toAccountId !== f.acc) return false;
    if (f.from && t.date < f.from) return false;
    if (f.to && t.date > f.to) return false;
    if (q) {
      const hay = (txnTitle(t) + " " + (t.note || "") + " " + (t.tags || []).join(" ") + " " + t.amount).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
  const s = f.sort;
  list.sort((a, b) => {
    if (s === "date-asc") return (a.date + (a.time || "")).localeCompare(b.date + (b.time || ""));
    if (s === "amount-desc") return Calc.main(b) - Calc.main(a);
    if (s === "amount-asc") return Calc.main(a) - Calc.main(b);
    return (b.date + (b.time || "")).localeCompare(a.date + (a.time || ""));
  });
  return list;
}
Views.transactions = function () {
  const f = UI.txFilter;
  const list = filteredTxns();
  const sums = Calc.sums(list.filter(t => (t.kind || "normal") === "normal"));
  const pages = Math.max(1, Math.ceil(list.length / f.per));
  f.page = clamp(f.page, 1, pages);
  const slice = list.slice((f.page - 1) * f.per, f.page * f.per);
  const opt = (v, l, cur) => '<option value="' + v + '"' + (cur === v ? " selected" : "") + ">" + esc(l) + "</option>";

  let rows = "", lastDate = "";
  for (const t of slice) {
    if (t.date !== lastDate) {
      lastDate = t.date;
      const day = list.filter(x => x.date === t.date);
      const ds = Calc.sums(day.filter(x => (x.kind || "normal") === "normal"));
      rows += '<tr style="background:var(--panel-2)"><td colspan="6" style="padding:7px 14px">' +
        '<span style="font-weight:650;font-size:13px">' + humanDate(t.date) + '</span> <span class="small muted">' + longDate(t.date) + "</span>" +
        '<span class="small" style="float:right">' + (ds.income ? '<span style="color:var(--up)">+' + fmtShort(ds.income) + "</span>  " : "") +
        (ds.expense ? '<span style="color:var(--down)">−' + fmtShort(ds.expense) + "</span>" : "") +
        '<span class="muted" style="margin-left:12px">Balans: <b class="num" style="color:var(--ink)">' +
        (S.settings.hideBalance ? "••••" : fmt(Calc.balanceAsOf(t.date))) + "</b></span></span></td></tr>";
    }
    const a = Calc.account(t.accountId);
    rows += '<tr>' +
      '<td style="width:52px">' + typeIcon(t) + "</td>" +
      '<td><div style="font-weight:600">' + esc(txnTitle(t)) + (t.kind === "debt" ? ' <span class="tag">qarz</span>' : t.kind === "goal" ? ' <span class="tag">maqsad</span>' : t.kind === "credit" ? ' <span class="tag">kredit</span>' : "") + "</div>" +
      (t.note ? '<div class="small muted">' + esc(t.note) + "</div>" : "") +
      ((t.tags || []).length ? '<div style="margin-top:3px">' + t.tags.map(x => '<span class="tag">#' + esc(x) + "</span>").join(" ") + "</div>" : "") + "</td>" +
      '<td class="small muted" style="white-space:nowrap">' + esc(a ? a.name : "—") + "</td>" +
      '<td class="small muted" style="white-space:nowrap">' + (t.time || "") + "</td>" +
      "<td>" + amtCell(t) + "</td>" +
      '<td style="width:118px"><div class="row-act">' +
      '<button class="icon-btn btn-sm" title="Tahrirlash" aria-label="Tahrirlash" onclick="txnModal(\'' + t.id + '\')">' + ico("edit", 15) + "</button>" +
      '<button class="icon-btn btn-sm" title="Nusxalash" aria-label="Nusxalash" onclick="dupTxn(\'' + t.id + '\')">' + ico("copy", 15) + "</button>" +
      '<button class="icon-btn btn-sm" title="O\'chirish" aria-label="O\'chirish" onclick="delTxn(\'' + t.id + '\')">' + ico("trash", 15) + "</button>" +
      "</div></td></tr>";
  }

  return head("Operatsiyalar", list.length + " ta yozuv topildi",
    '<button class="btn" onclick="exportCsv()">' + ico("down", 16) + " CSV</button>" +

function switchTxnType(k, id) {

function syncTransferCurrency() {
  const f = $("#txnForm"); if (!f) return;
  const a = Calc.account(f.accountId.value), b = Calc.account(f.toAccountId.value);
  const w = $("#toAmtWrap");
  if (w) w.hidden = !(a && b && a.currency !== b.currency);

function saveTxn(e, id) {
  e.preventDefault();
  const f = e.target;
  const type = f.dataset.type;
  const amount = parseAmount(f.amount.value);
  const err = $("#amtErr");
  if (!(amount > 0)) { f.amount.classList.add("err"); err.classList.add("on"); f.amount.focus(); return false; }
  f.amount.classList.remove("err"); err.classList.remove("on");
  if (type === "transfer" && f.accountId.value === f.toAccountId.value) { toast("O'tkazma uchun ikki xil hisob tanlang", "bad"); return false; }

  const rec = {
    id: id || uid(), type, kind: "normal", amount,
    accountId: f.accountId.value,
    toAccountId: type === "transfer" ? f.toAccountId.value : null,
    toAmount: type === "transfer" && f.toAmount && parseAmount(f.toAmount.value) > 0 ? parseAmount(f.toAmount.value) : null,
    categoryId: type === "transfer" ? null : f.dataset.cat || null,
    date: f.date.value || today(), time: f.time.value || nowTime(),
    note: f.note.value.trim(),
    tags: f.tags.value.split(",").map(x => x.trim()).filter(Boolean),
    createdAt: new Date().toISOString()
  };
  if (id) {
    const i = S.transactions.findIndex(x => x.id === id);
    rec.kind = S.transactions[i].kind || "normal";
    rec.createdAt = S.transactions[i].createdAt;
    rec.recurringId = S.transactions[i].recurringId;
    S.transactions[i] = rec;
  } else {
    S.transactions.push(rec);
    if (f.rec && f.rec.checked) {
      S.recurring.push({
        id: uid(), name: rec.note || txnTitle(rec), type: rec.type, amount: rec.amount,
        accountId: rec.accountId, toAccountId: rec.toAccountId, categoryId: rec.categoryId,
        note: rec.note, time: rec.time, freq: f.freq.value, nextDate: Calc.nextDate(rec.date, f.freq.value), active: true
      });
    }
  }
  persist(); closeModal(); renderNav(); render();
  toast(id ? "Operatsiya yangilandi" : "Operatsiya saqlandi", "ok");
  return false;
}
/* Operatsiya boshqa yozuv bilan bog'liqmi? (qarz to'lovi, maqsad, kredit) */
function txnLink(t) {
  if (t.paymentId && t.debtId) {
    const d = S.debts.find(x => x.id === t.debtId);
    if (!d) return null;
    return {
      note: "Bu — <b>" + esc(d.person) + "</b> bilan bog'liq qarz to'lovi.",
      label: "Qarz to'lovi ham bekor qilinsin",
      hint: "Qarz qoldig'i " + fmt(Calc.debtLeft(d), d.currency) + " dan " + fmt(Calc.debtLeft(d) + t.amount, d.currency) + " ga qaytadi",
      undo() { d.payments = (d.payments || []).filter(p => p.id !== t.paymentId); }
    };
  }
  if (t.increaseId && t.debtId) {
    const d = S.debts.find(x => x.id === t.debtId);
    if (!d) return null;
    return {
      note: "Bu — <b>" + esc(d.person) + "</b> qarzini oshirish yozuvi.",
      label: "Qarz oshirilishi ham bekor qilinsin",
      hint: "Umumiy qarz " + fmt(t.amount, d.currency) + " ga kamayadi",
      undo() { d.increases = (d.increases || []).filter(i => i.id !== t.increaseId); }
    };
  }
  if (t.debtId) {
    const d = S.debts.find(x => x.id === t.debtId);
    return d ? {
      note: "Bu — <b>" + esc(d.person) + "</b> qarzining balansga ta'siri. Qarzning o'zi saqlanib qoladi.",
      label: "Qarz ham butunlay o'chirilsin",
      checked: false,
      hint: "Belgilamasangiz, faqat balans ta'siri bekor qilinadi",
      undo() { S.debts = S.debts.filter(x => x.id !== d.id); S.transactions = S.transactions.filter(x => x.debtId !== d.id); }
    } : null;
  }
  if (t.contribId && t.goalId) {
    const g = S.goals.find(x => x.id === t.goalId);
    if (!g) return null;
    return {
      note: "Bu — <b>" + esc(g.name) + "</b> maqsadiga qo'shilgan jamg'arma.",
      label: "Jamg'arma yozuvi ham bekor qilinsin",
      hint: "Maqsad progressi qayta hisoblanadi",
      undo() { g.contributions = (g.contributions || []).filter(c => c.id !== t.contribId); }
    };
  }
  if (t.creditId) {
    const c = (S.credits || []).find(x => x.id === t.creditId);
    if (!c) return null;
    const p = (c.payments || []).slice().reverse().find(x => Math.abs(x.amount - t.amount) < 1 && x.date === t.date);
    if (!p) return {
      note: "Bu — <b>" + esc(c.name) + "</b> krediti bo'yicha yozuv.",
      label: "Kredit ham o'chirilsin", checked: false,
      hint: "Belgilamasangiz, faqat balans ta'siri bekor qilinadi",
      undo() { S.credits = S.credits.filter(x => x.id !== c.id); S.transactions = S.transactions.filter(x => x.creditId !== c.id); }
    };
    return {
      note: "Bu — <b>" + esc(c.name) + "</b> krediti bo'yicha " + p.n + "-oy to'lovi.",
      label: "Kredit to'lovi ham bekor qilinsin",
      hint: "To'lov grafigi va qolgan qarz qayta hisoblanadi",
      undo() {
        c.payments = (c.payments || []).filter(x => x.id !== p.id);
        if (p.extra > 0 && c.early && c.early.list) {
          const e = c.early.list.find(x => x.n === p.n);
          if (e) { e.amount = Math.round((e.amount - p.extra) * 100) / 100; if (e.amount <= 0.004) c.early.list = c.early.list.filter(x => x !== e); }
        }
      }
    };
  }
  return null;
}
async function delTxn(id, fromModal) {
  const t = S.transactions.find(x => x.id === id); if (!t) return;
  const link = txnLink(t);
  const head = "<b>" + esc(txnTitle(t)) + "</b> — " + fmt(t.amount) + " · " + longDate(t.date) + "<br>";
  let ok, revert = false;
  if (link) {
    const r = await confirmRevert({
      title: "Operatsiya o'chirilsinmi?",
      text: head + link.note,
      checkLabel: link.label, checkHint: link.hint, checked: link.checked,
      ok: "O'chirish"
    });
    ok = r.ok; revert = r.revert;
  } else {
    ok = await confirmDlg({ title: "Operatsiya o'chirilsinmi?", text: head + "Bu amalni qaytarib bo'lmaydi.", ok: "O'chirish", danger: true });
  }
  if (!ok) return;
  S.transactions = S.transactions.filter(x => x.id !== id);
  if (link && revert) link.undo();
  persist(); if (fromModal) closeModal();
  renderNav(); render();
  toast(link && revert ? "Operatsiya va bog'liq yozuv bekor qilindi" : "Operatsiya o'chirildi", "ok");
}
function dupTxn(id) {
  const t = S.transactions.find(x => x.id === id); if (!t) return;
  const c = Object.assign({}, t, { id: uid(), date: today(), time: nowTime(), createdAt: new Date().toISOString() });
  S.transactions.push(c); persist(); render(); toast("Nusxa bugungi sana bilan qo'shildi", "ok");
}

function saveAccount(e, id) {

  persist(); closeModal(); render(); toast(id ? "Hisob yangilandi" : "Hisob yaratildi", "ok");
  return false;
}
function archiveAccount(id) {
  const a = Calc.account(id); a.archived = !a.archived; persist(); render();
  toast(a.archived ? "Hisob arxivlandi" : "Hisob tiklandi", "ok");
}
async function delAccount(id) {
  const used = S.transactions.filter(t => t.accountId === id || t.toAccountId === id).length;
  const ok = await confirmDlg({
    title: "Hisob o'chirilsinmi?",
    text: used ? "Bu hisobda <b>" + used + " ta</b> operatsiya bor. Hisob bilan birga ular ham o'chiriladi." : "Hisob butunlay o'chiriladi.",
    ok: "O'chirish", danger: true
  });
  if (!ok) return;
  S.transactions = S.transactions.filter(t => t.accountId !== id && t.toAccountId !== id);
  S.accounts = S.accounts.filter(a => a.id !== id);
  persist(); closeModal(); render(); toast("Hisob o'chirildi", "ok");
}

<script>
"use strict";
/* ============================================================

    (list.length ? '<div class="grid g-2">' + list.map(d => {

        '<button class="btn btn-sm" onclick="raiseDebtModal(\'' + d.id + '\')">Qarzni oshirish</button>' +

        (debtHistory(d).length ? '<details style="margin-top:12px"><summary class="small muted" style="cursor:pointer">Harakatlar tarixi (' + debtHistory(d).length + " ta)</summary>" +
          '<div style="margin-top:8px">' + debtHistory(d).map(h =>
            '<div style="display:flex;gap:8px;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line-2)">' +

            "<span>" + esc(h.note || "") + (h.discount ? ' <span class="tag" style="color:var(--warn)">chegirma ' + fmt(h.discount, d.currency) + "</span>" : "") + "</span>" +

            '<button class="btn btn-sm btn-ghost" onclick="' + (h.kind === "raise" ? "delIncrease" : "delPayment") + "('" + d.id + "','" + h.id + '\')" aria-label="O\'chirish">' + ico("x", 13) + "</button></div>").join("") + "</div></details>" : "") +

        tab === "given" ? "Kimgadir qarz bergan bo'lsangiz, uni shu yerga yozib qo'ying." : "Kimdandir qarz olgan bo'lsangiz, uni shu yerga yozib qo'ying.",
        '<button class="btn btn-primary" onclick="debtModal()">+ Qarz qo\'shish</button>') + "</div>");
};
/* Qarzning balansga ta'sirini yozib turuvchi operatsiya (bo'lsa) */
function debtLinkTxn(id) {
  return S.transactions.find(t => t.debtId === id && !t.paymentId && !t.increaseId) || null;
}
function debtModal(id) {
  const d = id ? S.debts.find(x => x.id === id) : null;
  const v = d || { dir: UI.debtTab, person: "", amount: "", currency: S.settings.currency, date: today(), due: "", note: "", payments: [] };
  openModal(modalHead(d ? "Qarzni tahrirlash" : "Yangi qarz") +
    '<form class="modal-body" id="debtForm" onsubmit="return saveDebt(event,' + (d ? "'" + d.id + "'" : "null") + ')">' +
    '<div class="seg" style="margin-bottom:16px">' +
    '<button type="button" data-v="given" class="' + (v.dir === "given" ? "on" : "") + '" onclick="segPick(this,\'dir\')">Men berdim</button>' +
    '<button type="button" data-v="taken" class="' + (v.dir === "taken" ? "on" : "") + '" onclick="segPick(this,\'dir\')">Men oldim</button></div>' +
    '<div class="field"><label>Shaxs ismi</label><input class="input" name="person" data-autofocus required placeholder="Masalan: Aziz aka" value="' + esc(v.person) + '"></div>' +
    '<div class="row"><div class="field"><label>' + (d && (d.increases || []).length ? "Boshlang'ich summa" : "Summa") + '</label><input class="input" name="amount" inputmode="decimal" value="' + (v.amount ? groupNum(v.amount, 0) : "") + '" oninput="fmtAmountInput(this)"></div>' +
    '<div class="field"><label>Valyuta</label><select class="input" name="currency">' + Object.keys(CURRENCIES).map(k => '<option value="' + k + '"' + (k === v.currency ? " selected" : "") + ">" + k + "</option>").join("") + "</select></div></div>" +
    '<div class="row"><div class="field"><label>Berilgan sana</label><input type="date" class="input" name="date" value="' + v.date + '"></div>' +

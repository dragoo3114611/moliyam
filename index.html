async function saveNow() {
  clearTimeout(persist._t);
  const ok = await Vault.save(S);
  dirty = false;
  toast(ok ? "Ma'lumot saqlandi" : "Saqlab bo'lmadi — brauzer xotirasi cheklangan", ok ? "ok" : "bad");
}
async function linkDataFile() {
  if (!window.showSaveFilePicker) { toast("Bu brauzer faylga to'g'ridan-to'g'ri yozishni qo'llamaydi", "bad"); return; }
  try {
    const h = await window.showSaveFilePicker({
      suggestedName: "moliyam-malumot.json",
      types: [{ description: "Moliyam ma'lumot fayli", accept: { "application/json": [".json"] } }]
    });
    Vault.file = h; Vault.pendingFile = null; Vault.fileName = h.name;
    try { await IDB.set("fileHandle", h); } catch (e) { }
    await Vault.save(S);
    closeAllModals();
    toast("Endi barcha o'zgarishlar " + h.name + " fayliga ham yoziladi", "ok");
    render();
  } catch (e) { if (e && e.name !== "AbortError") toast("Faylni bog'lab bo'lmadi", "bad"); }
}
async function relinkDataFile() {
  const h = Vault.pendingFile; if (!h) return;
  try {
    const p = await h.requestPermission({ mode: "readwrite" });
    if (p !== "granted") { toast("Faylga ruxsat berilmadi", "bad"); return; }
    Vault.file = h; Vault.pendingFile = null;
    await Vault.save(S);
    closeAllModals(); toast("Fayl qayta ulandi: " + h.name, "ok"); render();
  } catch (e) { toast("Faylga ruxsat olinmadi", "bad"); }
}
async function openDataFile() {
  if (!window.showOpenFilePicker) { restorePick(); return; }
  try {
    const [h] = await window.showOpenFilePicker({
      types: [{ description: "Moliyam ma'lumot fayli", accept: { "application/json": [".json", ".moliyam"] } }]
    });
    const txt = await (await h.getFile()).text();
    const parsed = JSON.parse(txt);
    const data = parsed && parsed.data ? parsed.data : parsed;
    if (!data || !Array.isArray(data.transactions)) { toast("Faylda Moliyam ma'lumoti topilmadi", "bad"); return; }
    const ok = await confirmDlg({
      title: "Shu fayldan davom etilsinmi?",
      text: "Fayldagi <b>" + data.transactions.length + " operatsiya</b> yuklanadi va bundan keyin barcha o'zgarishlar shu faylga yoziladi.<br>Joriy <b>" + S.transactions.length + " operatsiya</b> almashtiriladi.",
      ok: "Ha, davom etish", danger: true
    });
    if (!ok) return;
    if (h.requestPermission) { const p = await h.requestPermission({ mode: "readwrite" }); if (p !== "granted") { toast("Faylga yozish ruxsati berilmadi", "bad"); return; } }
    Vault.file = h; Vault.pendingFile = null; Vault.fileName = h.name;
    try { await IDB.set("fileHandle", h); } catch (e) { }
    S = Object.assign(blankState(), data);
    S.settings = Object.assign(blankState().settings, data.settings || {});
    S.settings.onboarded = true;
    await Vault.save(S);
    closeAllModals(); applyTheme(); leaveGate(); renderNav(); render();
    toast("Ma'lumot fayldan yuklandi va bog'landi", "ok");
  } catch (e) { if (e && e.name !== "AbortError") toast("Faylni ochib bo'lmadi", "bad"); }
}
async function unlinkDataFile() {
  Vault.file = null; Vault.pendingFile = null; Vault.fileName = "";
  try { await IDB.del("fileHandle"); } catch (e) { }
  Vault.paint(); closeAllModals(); toast("Fayl bog'lanishi uzildi — ma'lumot brauzerda saqlanadi", "ok");
}
function toggleAutoFileBackup(btn) {
  S.settings.autoFileBackup = S.settings.autoFileBackup === false;
  persist();
  if (btn) btn.textContent = S.settings.autoFileBackup ? "Yoqilgan" : "O'chirilgan";
}
async function snapRestore(i) {
  const s = Vault.snaps[i]; if (!s) return;
  const ok = await confirmDlg({
    title: "Nusxa tiklansinmi?",
    text: "<b>" + esc(stamp(s.at)) + "</b> holatidagi ma'lumot (" + s.count + " ta operatsiya) qaytariladi.<br>Joriy holat almashtiriladi.",
    ok: "Tiklash", danger: true
  });
  if (!ok) return;
  try {
    const p = JSON.parse(s.json);
    const data = p.data || p;
    S = Object.assign(blankState(), data);
    S.settings = Object.assign(blankState().settings, data.settings || {});
    S.settings.onboarded = true;
    await Vault.save(S);
    closeAllModals(); applyTheme(); renderNav(); render();
    toast("Nusxa tiklandi", "ok");
  } catch (e) { toast("Nusxani tiklab bo'lmadi", "bad"); }
}

function restorePick() { $("#fileIn").click(); }
async function handleRestoreFile(file) {
  const text = await file.text();
  let parsed;
  try { parsed = JSON.parse(text); } catch (e) { toast("Zaxira nusxasini tiklab bo'lmadi — fayl formati noto'g'ri", "bad"); return; }
  const data = parsed && parsed.data ? parsed.data : parsed;
  if (!data || !Array.isArray(data.transactions) || !Array.isArray(data.accounts)) { toast("Zaxira nusxasini tiklab bo'lmadi — ma'lumot topilmadi", "bad"); return; }
  const ok = await confirmDlg({
    title: "Ma'lumotlar almashtirilsinmi?",
    text: "Joriy ma'lumotlaringiz (<b>" + S.transactions.length + " operatsiya</b>) o'chiriladi va fayldagi <b>" + data.transactions.length + " operatsiya</b> yuklanadi.<br>Bu amalni qaytarib bo'lmaydi.",
    ok: "Tiklash", danger: true
  });
  if (!ok) return;
  S = Object.assign(blankState(), data);
  S.settings = Object.assign(blankState().settings, data.settings || {});
  S.settings.onboarded = true;
  await Store.save(S);
  applyTheme(); leaveGate(); renderNav(); render();
  toast("Ma'lumotlar tiklandi", "ok");
}

/* ============================================================
   21. PIN QULFI
   ============================================================ */
let pinBuf = "", pinMode = "unlock", pinFirst = "", pinTarget = "admin";
function pinHash(p) { let h = 5381; const s = "moliyam:" + p; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return String(h); }
function pinScreen(mode) {
  pinMode = mode; pinBuf = ""; pinFirst = "";
  const titles = {
    unlock: "Ilova qulflangan",
    set: pinTarget === "operator" ? "Yangi operator PIN kodi" : "Yangi admin PIN kodi",
    confirm: "PIN kodni takrorlang"
  };
  const el = document.createElement("div");
  el.className = "gate"; el.id = "pinGate";
  el.innerHTML = '<div class="gate-card" style="text-align:center">' +
    '<div class="brand-mark" style="margin:0 auto 14px;width:46px;height:46px"><svg width="26" height="26" viewBox="0 0 64 64"><path d="M32 12c8 0 14 6 14 14v26H18V26c0-8 6-14 14-14z" fill="none" stroke="#F2C14E" stroke-width="5"/><path d="M32 27v17M25 34h14" stroke="#F2C14E" stroke-width="5" stroke-linecap="round"/></svg></div>' +
    '<h2 id="pinTitle">' + titles[mode] + "</h2>" +
    '<p class="muted small" id="pinHint" style="margin:6px 0 0">' +
    (mode === "unlock" && S.settings.operatorPin ? "Admin yoki operator kodini kiriting" : "4 xonali kodni kiriting") + "</p>" +
    '<div class="pin-dots" id="pinDots">' + "<i></i>".repeat(4) + "</div>" +
    '<div class="keypad">' + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => "<button onclick=\"pinKey('" + n + "')\">" + n + "</button>").join("") +
    (mode === "unlock" ? "<button></button>" : '<button onclick="pinCancel()" style="font-size:14px">Bekor</button>') +
    "<button onclick=\"pinKey('0')\">0</button><button onclick=\"pinKey('del')\" aria-label=\"O'chirish\">⌫</button></div></div>";
  document.body.appendChild(el);
  document.addEventListener("keydown", pinKeyboard);
}
function pinKeyboard(e) {
  if (!$("#pinGate")) return;
  if (/^[0-9]$/.test(e.key)) pinKey(e.key);
  else if (e.key === "Backspace") pinKey("del");
}
function pinKey(k) {
  if (k === "del") pinBuf = pinBuf.slice(0, -1);
  else if (pinBuf.length < 4) pinBuf += k;
  $$("#pinDots i").forEach((d, i) => d.classList.toggle("on", i < pinBuf.length));
  if (pinBuf.length === 4) setTimeout(pinDone, 130);
}
function pinDone() {
  if (pinMode === "unlock") {
    const h = pinHash(pinBuf);
    if (S.settings.pin && h === S.settings.pin) { ROLE = "admin"; pinClose(); startApp(); }
    else if (S.settings.operatorPin && h === S.settings.operatorPin) { ROLE = "operator"; pinClose(); startApp(); toast("Operator rejimi: Qarzlar va Magazin", "ok"); }
    else { pinShake("Kod noto'g'ri. Qayta urinib ko'ring."); }
  } else if (pinMode === "set") {
    pinFirst = pinBuf; pinBuf = "";
    $("#pinTitle").textContent = "PIN kodni takrorlang";
    $("#pinHint").textContent = "Xato bo'lmasligi uchun yana bir marta kiriting";
    $$("#pinDots i").forEach(d => d.classList.remove("on"));
    pinMode = "confirm";
  } else {
    if (pinBuf === pinFirst) {
      if (pinTarget === "operator" && pinHash(pinBuf) === S.settings.pin) { pinShake("Operator kodi admin kodidan farq qilishi kerak."); pinMode = "set"; pinFirst = ""; return; }
      if (pinTarget === "admin" && pinHash(pinBuf) === S.settings.operatorPin) { pinShake("Admin kodi operator kodidan farq qilishi kerak."); pinMode = "set"; pinFirst = ""; return; }
      if (pinTarget === "operator") S.settings.operatorPin = pinHash(pinBuf);
      else S.settings.pin = pinHash(pinBuf);
      persist(); pinClose(); applyRole(); renderNav(); render();
      toast(pinTarget === "operator" ? "Operator PIN kodi o'rnatildi" : "Admin PIN kodi o'rnatildi", "ok");
    }
    else { pinShake("Kodlar mos kelmadi. Boshidan kiriting."); pinMode = "set"; pinFirst = ""; $("#pinTitle").textContent = pinTarget === "operator" ? "Yangi operator PIN kodi" : "Yangi admin PIN kodi"; }
  }
}
function pinShake(msg) {
  pinBuf = "";
  const h = $("#pinHint"); h.textContent = msg; h.style.color = "var(--down)";
  const c = $("#pinGate .gate-card");
  c.animate([{ transform: "translateX(0)" }, { transform: "translateX(-9px)" }, { transform: "translateX(9px)" }, { transform: "translateX(0)" }], { duration: 240 });
  $$("#pinDots i").forEach(d => d.classList.remove("on"));
}
function pinClose() { const g = $("#pinGate"); if (g) g.remove(); document.removeEventListener("keydown", pinKeyboard); }
function pinCancel() { pinClose(); }
function pinSetup(target) { pinTarget = target || "admin"; pinScreen("set"); }
async function pinRemove(target) {
  const op = target === "operator";
  if (!(await confirmDlg({
    title: (op ? "Operator" : "Admin") + " PIN kodi o'chirilsinmi?",
    text: op ? "Operator rejimi bilan kirish imkoni yo'qoladi." : "Ilova ochilishida admin kodi so'ralmaydi.",
    ok: "O'chirish", danger: true
  }))) return;
  if (op) S.settings.operatorPin = null; else S.settings.pin = null;
  persist(); applyRole(); renderNav(); render();
  toast((op ? "Operator" : "Admin") + " PIN kodi o'chirildi", "ok");
}
function lockNow() {
  if (!S.settings.pin && !S.settings.operatorPin) return;
  $("#app").hidden = true; $("#fab").hidden = true; closeAllModals();
  ROLE = "admin"; pinTarget = "admin"; pinScreen("unlock");
}

      '<div class="field"><label>Hisob nomi</label><input class="input" id="obName" value="' + esc(OB.accName) + '" oninput="OB.accName=this.value"></div>' +

/* ============================================================
   23. ESLATMALAR
   ============================================================ */
function checkAlerts() {
  if (!S.settings.notify) return;
  const msgs = [];
  for (const b of S.budgets) {
    const st = Calc.budgetState(b);
    if (st.pct >= 100) msgs.push({ m: Calc.budgetName(b) + " byudjeti oshib ketdi", k: "bad" });
    else if (st.pct >= 80) msgs.push({ m: Calc.budgetName(b) + " byudjetining " + Math.round(st.pct) + "% ishlatildi", k: "" });
  }
  for (const a of (typeof Credit !== "undefined" ? Credit.alerts() : [])) {
    msgs.push({
      m: a.days < 0 ? a.c.name + " to'lovi " + Math.abs(a.days) + " kun kechikdi — " + fmtC(a.row.total)
        : a.days === 0 ? "Bugun " + a.c.name + " to'lov kuni — " + fmtC(a.row.total)
        : a.c.name + " to'loviga " + a.days + " kun qoldi — " + fmtC(a.row.total),
      k: a.days <= 0 ? "bad" : ""
    });
  }
  for (const d of S.debts) {
    if (Calc.debtLeft(d) <= 0 || !d.due) continue;
    const days = diffDays(today(), d.due);
    if (days < 0) msgs.push({ m: d.person + " bilan qarz muddati " + Math.abs(days) + " kun kechikdi", k: "bad" });
    else if (days <= 3) msgs.push({ m: d.person + " bilan qarz muddatiga " + days + " kun qoldi", k: "" });
  }
  msgs.slice(0, 3).forEach((x, i) => setTimeout(() => toast(x.m, x.k), 700 + i * 900));
}

/* ============================================================
   24. ISHGA TUSHIRISH
   ============================================================ */
function startApp() {
  $("#app").hidden = false;
  $("#fab").hidden = false;
  applyRole();
  const made = ROLE === "operator" ? 0 : Calc.runRecurring();
  renderNav();
  render();
  if (made) toast(made + " ta takroriy operatsiya avtomatik qo'shildi", "ok");
  if (ROLE !== "operator") checkAlerts();
}
async function init() {
  await Vault.init();
  const saved = await Vault.load();
  if (saved && saved.accounts) {
    S = Object.assign(blankState(), saved);
    S.settings = Object.assign(blankState().settings, saved.settings || {});
    if (!S.categories || !S.categories.length) S.categories = blankState().categories;
  }
  applyTheme();
  if (window.matchMedia) {
    try { matchMedia("(prefers-color-scheme:dark)").addEventListener("change", () => { if (S.settings.theme === "system") applyTheme(); }); } catch (e) { }
  }

  /* hodisalar */
  $("#fab").addEventListener("click", () => txnModal());
  $("#themeBtn").addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
  $("#lockBtn").addEventListener("click", lockNow);
  $("#backupBtn").addEventListener("click", backup);
  $("#importBtn").addEventListener("click", restorePick);
  $("#menuBtn").addEventListener("click", () => $("#side").classList.toggle("open"));
  $("#fileIn").addEventListener("change", (e) => { const f = e.target.files[0]; if (f) handleRestoreFile(f); e.target.value = ""; });
  $("#q").addEventListener("keydown", (e) => { if (e.key === "Enter") globalSearch(e.target.value); });
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#q").focus(); $("#q").select(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "n" && !$("#obGate") && ROLE !== "operator") { e.preventDefault(); txnModal(); }
    else if (e.key === "Escape" && modalStack.length) { closeModal(); }
  });
  /* --- avtomatik saqlash himoyalari --- */
  window.addEventListener("beforeunload", () => { if (dirty) { clearTimeout(persist._t); Vault.syncFlush(S); dirty = false; } });
  window.addEventListener("pagehide", flushNow);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushNow(); });
  setInterval(() => { if (dirty) flushNow(); }, 15000);          /* har 15 soniyada tekshiruv */
  booted = true;
  Vault.lastSaved = Vault.lastSaved || new Date();
  Vault.paint();
  if (Vault.pendingFile) {
    setTimeout(() => toast("Bog'langan faylga ruxsat kerak — yuqoridagi «Saqlandi» tugmasini bosing", "bad"), 900);
  }

  if (!S.settings.onboarded) onboarding();
  else if (S.settings.pin || S.settings.operatorPin) pinScreen("unlock");
  else startApp();
}
init();
</script>

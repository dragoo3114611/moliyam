    (S.accounts.length ? (function () {
      const lk = d ? debtLinkTxn(d.id) : null;
      return '<label class="set-row" style="border:0"><input type="checkbox" name="link"' + (d ? (lk ? " checked" : "") : " checked") + ">" +
        '<span class="t"><b>Hisob balansiga ta\'sir qilsin</b><span>' +
        (d ? "Belgini olsangiz, balansdagi ta'siri bekor qilinadi; qo'ysangiz qaytadi" : "Pul hisobdan yechiladi yoki hisobga qo'shiladi") + "</span></span></label>" +
        '<div class="field">' + accSelect("accountId", lk ? lk.accountId : v.accountId) + "</div>";
    })() : "") +
    '<p class="small muted" style="margin:0">Qarz operatsiyalari daromad yoki xarajat statistikasiga qo\'shilmaydi — faqat balansni o\'zgartiradi.</p>' +
    "</form>" +
    '<div class="modal-foot"><button class="btn" onclick="closeModal()">Bekor qilish</button>' +

function segPick(el, key) {
  $$("button", el.parentElement).forEach(x => x.classList.remove("on"));
  el.classList.add("on");
  el.closest("form").dataset[key] = el.dataset.v;
}
function saveDebt(e, id) {
  e.preventDefault();
  const f = e.target;
  const amount = parseAmount(f.amount.value);
  if (!f.person.value.trim()) { toast("Shaxs ismini kiriting", "bad"); return false; }
  if (!(amount > 0)) { toast("Iltimos, summani to'g'ri kiriting", "bad"); return false; }
  const dir = f.dataset.dir || "given";
  if (id) {
    const d = S.debts.find(x => x.id === id);
    Object.assign(d, { dir, person: f.person.value.trim(), amount, currency: f.currency.value, date: f.date.value, due: f.due.value || "", note: f.note.value.trim() });
    /* balansga ta'sirni yoqish / o'chirish / yangilash */
    const lk = debtLinkTxn(id);
    const want = f.link && f.link.checked && f.accountId;
    if (want && !lk) {
      S.transactions.push({
        id: uid(), type: dir === "given" ? "expense" : "income", kind: "debt", amount,
        accountId: f.accountId.value, categoryId: null, date: d.date, time: nowTime(),
        note: (dir === "given" ? "Qarz berildi: " : "Qarz olindi: ") + d.person,
        tags: [], debtId: id, createdAt: new Date().toISOString()
      });
      toast("Balansga ta'siri yoqildi", "ok");
    } else if (!want && lk) {
      S.transactions = S.transactions.filter(t => t.id !== lk.id);
      toast("Balansga ta'siri bekor qilindi", "ok");
    } else if (want && lk) {
      lk.amount = amount; lk.accountId = f.accountId.value; lk.date = d.date;
      lk.type = dir === "given" ? "expense" : "income";
      lk.note = (dir === "given" ? "Qarz berildi: " : "Qarz olindi: ") + d.person;
    }
  } else {
    const debt = {
      id: uid(), dir, person: f.person.value.trim(), amount, currency: f.currency.value,
      date: f.date.value || today(), due: f.due.value || "", note: f.note.value.trim(), payments: [], increases: [], createdAt: new Date().toISOString()
    };
    S.debts.push(debt);
    if (f.link && f.link.checked && f.accountId) {
      S.transactions.push({
        id: uid(), type: dir === "given" ? "expense" : "income", kind: "debt", amount,
        accountId: f.accountId.value, categoryId: null, date: debt.date, time: nowTime(),
        note: (dir === "given" ? "Qarz berildi: " : "Qarz olindi: ") + debt.person,
        tags: [], debtId: debt.id, createdAt: new Date().toISOString()
      });
    }
  }
  persist(); closeModal(); renderNav(); render(); toast(id ? "Qarz yangilandi" : "Qarz qo'shildi", "ok");
  return false;
}
/* Qarz harakatlari tarixi: to'lovlar + oshirishlar, sana bo'yicha */
function debtHistory(d) {
  const list = [];
  (d.payments || []).forEach(p => list.push({ kind: "pay", id: p.id, date: p.date, amount: p.amount, discount: p.discount || 0, note: p.note }));
  (d.increases || []).forEach(i => list.push({ kind: "raise", id: i.id, date: i.date, amount: i.amount, note: i.note }));
  return list.sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id));
}

/* ---------- Qarzni to'lash (chegirma bilan) ---------- */
function payDebtModal(id) {
  const d = S.debts.find(x => x.id === id);
  const left = Calc.debtLeft(d);
  openModal(modalHead("Qarzni to'lash", d.person + " · qolgan " + fmt(left, d.currency)) +
    '<form class="modal-body" id="payForm" data-left="' + left + '" data-cur="' + d.currency + '" onsubmit="return savePayment(event,\'' + id + '\')">' +
    '<div class="field"><label for="payCover">Beriladigan summa</label>' +
    '<input class="input amount-input" id="payCover" name="cover" inputmode="decimal" data-autofocus value="' + groupNum(left, 0) + '" oninput="fmtAmountInput(this);payCalc()"></div>' +
    '<div class="chips" style="margin-bottom:16px">' +
    [0.25, 0.5, 1].map(x => '<button type="button" class="chip" onclick="setCover(' + x + ')">' + (x === 1 ? "Qarzni to\'liq yopish" : x * 100 + "%") + "</button>").join("") + "</div>" +
    '<div class="field"><label>Chegirma (skidka)</label><div class="chips" id="discChips">' +
    [0, 10, 20, 25, 50].map(x => '<button type="button" class="chip' + (x === 0 ? " on" : "") + '" data-p="' + x + '" onclick="setDisc(this,' + x + ')">' + (x === 0 ? "Chegirmasiz" : x + "%") + "</button>").join("") +
    '<span style="display:flex;align-items:center;gap:6px"><input class="input" id="discPct" style="width:78px;text-align:right" inputmode="decimal" value="0" oninput="setDiscFree(this.value)"><span class="small muted">%</span></span></div></div>' +
    '<div id="paySum" style="background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:14px"></div>' +
    (S.accounts.length ? '<label class="set-row" style="border:0"><input type="checkbox" name="link" checked>' +
      '<span class="t"><b>Hisob balansiga ta\'sir qilsin</b><span>' + (d.dir === "given" ? "Naqd to'lov hisobga qaytadi" : "Naqd to'lov hisobdan chiqadi") + "</span></span></label>" +
      '<div class="field">' + accSelect("accountId") + "</div>" : "") +
    '<div class="field"><label>Sana</label><input type="date" class="input" name="date" value="' + today() + '"></div>' +
    '<div class="field"><label>Izoh</label><input class="input" name="note" placeholder="Ixtiyoriy"></div>' +
    "</form>" +
    '<div class="modal-foot"><button class="btn" onclick="closeModal()">Bekor qilish</button>' +
    '<button class="btn btn-primary" onclick="document.getElementById(\'payForm\').requestSubmit()">To\'lovni saqlash</button></div>');
  payCalc();
}
/* Foydalanuvchi beriladigan naqd summani kiritadi.
   Chegirma shu summadan foiz sifatida hisoblanadi va qarzning ustidan kechiriladi:
   yopiladigan qarz = naqd + chegirma (qolgan qarzdan oshib ketmaydi). */
function payValues() {
  const f = $("#payForm");
  if (!f || !f.cover) return null;
  const cur = f.dataset.cur;
  const left = +f.dataset.left;
  const cash = Math.max(0, parseAmount(f.cover.value) || 0);
  const pct = clamp(parseAmount($("#discPct").value) || 0, 0, 100);
  let discount = Math.round(cash * pct / 100);
  let capped = false;
  if (cash + discount > left) { discount = Math.max(0, left - cash); capped = true; }
  return { f, cur, cash, pct, discount, cover: cash + discount, left, capped };
}
function payCalc() {
  const v = payValues();
  if (!v) return;
  const row = (l, val, style) => '<div style="display:flex;justify-content:space-between;padding:3px 0;' + (style || "") + '"><span>' + l + '</span><b class="num">' + val + "</b></div>";
  $("#paySum").innerHTML =
    row("Beriladigan summa", fmt(v.cash, v.cur), "color:var(--ink-2);font-size:13.5px") +
    row("Chegirma (" + (v.pct % 1 ? v.pct.toFixed(1) : v.pct) + "%)", "+" + fmt(v.discount, v.cur), "color:var(--warn);font-size:13.5px") +
    row("Qarzdan yopiladi", fmt(v.cover, v.cur), "border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-size:15px;font-weight:650") +
    '<div class="small muted" style="margin-top:6px">To\'lovdan keyin qoladi: ' + fmt(Math.max(0, v.left - v.cover), v.cur) +
    (v.capped ? ' · chegirma qolgan qarz bo\'yicha cheklandi' : "") + "</div>";
}
function setCover(mult) {
  const f = $("#payForm");
  const left = +f.dataset.left;
  const pct = clamp(parseAmount($("#discPct").value) || 0, 0, 100);
  /* "To'liq yopish" — chegirma hisobga olingan holda kerakli naqd summa */
  const val = mult === 1 ? Math.round(left / (1 + pct / 100)) : Math.round(left * mult);
  f.cover.value = groupNum(val, 0);
  payCalc();
}
function setDisc(el, p) {
  $$("#discChips .chip").forEach(x => x.classList.remove("on"));
  el.classList.add("on");
  $("#discPct").value = p;
  payCalc();
}
function setDiscFree(v) {
  const p = clamp(parseAmount(v) || 0, 0, 100);
  $$("#discChips .chip").forEach(x => x.classList.toggle("on", +x.dataset.p === p));
  payCalc();
}
function savePayment(e, id) {
  e.preventDefault();
  const d = S.debts.find(x => x.id === id);
  const v = payValues();
  const f = e.target;
  if (!v || !(v.cash > 0)) { toast("Iltimos, summani to'g'ri kiriting", "bad"); return false; }
  if (v.cash > v.left + 0.001) { toast("Beriladigan summa qolgan qarzdan katta bo'lishi mumkin emas", "bad"); return false; }
  const pay = { id: uid(), amount: v.cash, discount: v.discount, date: f.date.value || today(), note: f.note.value.trim() };
  d.payments = d.payments || [];
  d.payments.push(pay);
  if (f.link && f.link.checked && f.accountId && v.cash > 0) {
    S.transactions.push({
      id: uid(), type: d.dir === "given" ? "income" : "expense", kind: "debt", amount: v.cash,
      accountId: f.accountId.value, categoryId: null, date: pay.date, time: nowTime(),
      note: "Qarz to'lovi: " + d.person + (v.discount ? " (chegirma " + fmt(v.discount, d.currency) + ")" : ""),
      tags: [], debtId: d.id, paymentId: pay.id, createdAt: new Date().toISOString()
    });
  }
  persist(); closeModal(); renderNav(); render();
  toast(Calc.debtLeft(d) <= 0 ? (v.discount ? "Qarz chegirma bilan yopildi" : "Qarz to'liq yopildi") : "To'lov qo'shildi", "ok");
  return false;
}

/* ---------- Qarzni oshirish ---------- */
function raiseDebtModal(id) {
  const d = S.debts.find(x => x.id === id);
  openModal(modalHead("Qarzni oshirish", d.person + " · hozirgi qarz " + fmt(Calc.debtLeft(d), d.currency)) +
    '<form class="modal-body" id="raiseForm" onsubmit="return saveRaise(event,\'' + id + '\')">' +
    '<div class="field"><label>Qo\'shiladigan summa</label>' +
    '<input class="input amount-input" name="amount" inputmode="decimal" data-autofocus placeholder="0" oninput="fmtAmountInput(this)"></div>' +
    '<div class="field"><label>Sana</label><input type="date" class="input" name="date" value="' + today() + '"></div>' +
    '<div class="field"><label>Izoh</label><input class="input" name="note" placeholder="Masalan: yana qarz berildi"></div>' +
    (S.accounts.length ? '<label class="set-row" style="border:0"><input type="checkbox" name="link" checked>' +
      '<span class="t"><b>Hisob balansiga ta\'sir qilsin</b><span>' + (d.dir === "given" ? "Pul hisobdan yechiladi" : "Pul hisobga qo'shiladi") + "</span></span></label>" +
      '<div class="field">' + accSelect("accountId") + "</div>" : "") +
    '<p class="small muted" style="margin:0">Umumiy qarz summasi shu miqdorga oshadi, oldingi to\'lovlar saqlanib qoladi.</p>' +
    "</form>" +
    '<div class="modal-foot"><button class="btn" onclick="closeModal()">Bekor qilish</button>' +
    '<button class="btn btn-primary" onclick="document.getElementById(\'raiseForm\').requestSubmit()">Qo\'shish</button></div>');
}
function saveRaise(e, id) {
  e.preventDefault();
  const f = e.target, d = S.debts.find(x => x.id === id), amount = parseAmount(f.amount.value);
  if (!(amount > 0)) { toast("Iltimos, summani to'g'ri kiriting", "bad"); return false; }
  const inc = { id: uid(), amount, date: f.date.value || today(), note: f.note.value.trim() };
  d.increases = d.increases || [];
  d.increases.push(inc);

<script>
"use strict";
/* ============================================================
   15b. MAGAZIN (sklad va sotuv)
   Alohida hisob: bu yerdagi kirim/chiqim/sotuv operatsiyalar
   ro'yxatiga va daromad/xarajat statistikasiga QO'SHILMAYDI.
   ============================================================ */
const UNITS = ["dona", "litr", "kg", "quti", "blok", "metr"];
function shopDB() {
  if (!S.shop || !Array.isArray(S.shop.items)) S.shop = { items: [], moves: [] };
  if (!Array.isArray(S.shop.moves)) S.shop.moves = [];
  return S.shop;
}
const Shop = {
  item: (id) => shopDB().items.find(i => i.id === id),
  moves: (itemId) => shopDB().moves.filter(m => !itemId || m.itemId === itemId),
  stockValue: () => shopDB().items.reduce((s, i) => s + i.stock * i.cost, 0),
  saleValue: () => shopDB().items.reduce((s, i) => s + i.stock * i.price, 0),
  sales(from, to) {
    return shopDB().moves.filter(m => m.kind === "sale" && (!from || m.date >= from) && (!to || m.date <= to));
  },
  sum(list, key) { return list.reduce((s, m) => s + (m[key] || 0), 0); },
  margin: (i) => i.cost > 0 ? ((i.price - i.cost) / i.cost) * 100 : 0,
  low: (i) => i.min > 0 && i.stock <= i.min,

  /* Foyda va zarar hisoboti:
     tushum − sotilgan tovar tan narxi = yalpi foyda
     yalpi foyda − yaroqsizga chiqarilgan tovar tan narxi = sof foyda */
  report(from, to) {
    const inRange = (m) => (!from || m.date >= from) && (!to || m.date <= to);
    const moves = shopDB().moves.filter(inRange);
    const r = { revenue: 0, cogs: 0, gross: 0, writeoff: 0, net: 0, purchases: 0, qtySold: 0, sales: 0, byItem: [] };
    const map = {};
    for (const m of moves) {
      if (m.kind === "sale") {
        r.revenue += m.total; r.cogs += (m.cost != null ? m.cost : m.qty * (m.unitCost || 0));
        r.qtySold += m.qty; r.sales++;
        const k = m.itemId;
        map[k] = map[k] || { qty: 0, revenue: 0, cogs: 0, profit: 0 };
        map[k].qty += m.qty; map[k].revenue += m.total;
        map[k].cogs += (m.cost != null ? m.cost : m.qty * (m.unitCost || 0));
        map[k].profit += m.profit;
      } else if (m.kind === "out") r.writeoff += m.total;
      else if (m.kind === "in") r.purchases += m.total;
    }
    r.gross = r.revenue - r.cogs;
    r.net = r.gross - r.writeoff;
    r.byItem = Object.keys(map).map(id => {
      const it = Shop.item(id);
      return Object.assign({ id, name: it ? it.name : "O'chirilgan mahsulot", icon: it ? it.icon : "📦", color: it ? it.color : "#7C939C", unit: it ? it.unit : "" }, map[id]);
    }).sort((a, b) => b.profit - a.profit);
    return r;
  }
};

function shopRangeDates() {
  const t = today();
  if (UI.shopRange === "last") { const p = addMonths(t, -1); return [monthStart(p), monthEnd(p)]; }
  if (UI.shopRange === "year") return [t.slice(0, 4) + "-01-01", t];
  if (UI.shopRange === "all") return ["", ""];
  return [monthStart(t), monthEnd(t)];
}

function itemCalc() {
  const f = $("#itemForm"); if (!f || !f.cost) return;
  const c = parseAmount(f.cost.value) || 0, p = parseAmount(f.price.value) || 0;
  const el = $("#itemProfit"); if (!el) return;
  if (!c && !p) { el.innerHTML = '<span class="muted">Narxlarni kiritsangiz, dona foyda shu yerda ko\'rinadi.</span>'; return; }
  const d = p - c;
  el.innerHTML = '<span style="color:' + (d >= 0 ? "var(--up)" : "var(--down)") + ';font-weight:650">Dona foyda: ' + fmt(d) + "</span>" +
    (c ? ' <span class="muted">· ustama ' + Math.round(d / c * 100) + "%</span>" : "");
}
function saveItem(e, id) {
  e.preventDefault();
  const f = e.target;
  if (!f.name.value.trim()) { toast("Mahsulot nomini kiriting", "bad"); return false; }
  const cost = parseAmount(f.cost.value) || 0, price = parseAmount(f.price.value) || 0;
  const stock = parseAmount(f.stock.value) || 0;
  const rec = {
    id: id || uid(), name: f.name.value.trim(), unit: f.unit.value, cost, price, stock,
    min: parseAmount(f.min.value) || 0, icon: f.dataset.icon, color: f.dataset.color, note: f.note.value.trim(),
    createdAt: new Date().toISOString()
  };
  const db = shopDB();
  if (id) {
    const i = db.items.findIndex(x => x.id === id);
    rec.createdAt = db.items[i].createdAt;
    db.items[i] = rec;
  } else {
    db.items.push(rec);
    if (stock > 0) db.moves.push({ id: uid(), itemId: rec.id, kind: "in", qty: stock, unitCost: cost, total: stock * cost, profit: 0, date: today(), time: nowTime(), note: "Boshlang'ich qoldiq" });
  }
  persist(); closeModal(); render(); toast(id ? "Mahsulot yangilandi" : "Mahsulot qo'shildi", "ok");
  return false;
}
async function delItem(id) {
  const it = Shop.item(id);

  if (!(await confirmDlg({
    title: "Mahsulot o'chirilsinmi?",
    text: "<b>" + esc(it.name) + "</b>" + (cnt ? " va uning " + cnt + " ta harakati" : "") + " o'chiriladi.",

  }))) return;
  const db = shopDB();

function stockValues() {
  const f = $("#stockForm"); if (!f || !f.qty) return null;
  const it = Shop.item(f.itemId.value);
  const qty = Math.max(0, parseAmount(f.qty.value) || 0);
  const cost = f.cost ? Math.max(0, parseAmount(f.cost.value) || 0) : it.cost;
  const isIn = f.dataset.kind === "in";
  const newStock = isIn ? it.stock + qty : it.stock - qty;
  const avg = isIn && (it.stock + qty) > 0 ? Math.round((it.stock * it.cost + qty * cost) / (it.stock + qty)) : it.cost;
  return { f, it, qty, cost, isIn, newStock, avg, total: qty * cost };
}
function stockCalc() {
  const v = stockValues(); if (!v) return;
  const row = (l, val, st) => '<div style="display:flex;justify-content:space-between;padding:3px 0;' + (st || "") + '"><span>' + l + '</span><b class="num">' + val + "</b></div>";
  $("#stockSum").innerHTML =
    row(v.isIn ? "Kirim summasi" : "Chiqim qiymati (tan narxda)", fmt(v.total), "font-size:13.5px;color:var(--ink-2)") +
    row("Yangi qoldiq", groupNum(v.newStock, 0) + " " + v.it.unit, "font-size:15px;font-weight:650;border-top:1px solid var(--line);margin-top:6px;padding-top:8px") +
    (v.isIn && v.avg !== v.it.cost ? '<div class="small muted" style="margin-top:6px">O\'rtacha tan narx ' + fmt(v.it.cost) + " → " + fmt(v.avg) + " ga o'zgaradi</div>" : "") +
    (v.newStock < 0 ? '<div class="small" style="color:var(--down);margin-top:6px">Qoldiqdan ko\'p chiqim qilib bo\'lmaydi</div>' : "");
}
function saveStock(e) {
  e.preventDefault();
  const v = stockValues(); const f = e.target;
  if (!v || !(v.qty > 0)) { toast("Miqdorni to'g'ri kiriting", "bad"); return false; }
  if (v.newStock < 0) { toast("Skladda bunchalik mahsulot yo'q", "bad"); return false; }
  if (v.isIn) { v.it.cost = v.avg; v.it.stock = v.newStock; }
  else v.it.stock = v.newStock;

    id: uid(), itemId: v.it.id, kind: v.isIn ? "in" : "out", qty: v.qty,
    unitCost: v.isIn ? v.cost : v.it.cost, total: v.total, profit: 0,

  });

/* ---------- Sotish ---------- */
function sellModal(id) {

}
function setQty(q) { const f = $("#sellForm"); f.qty.value = groupNum(q, 0); sellCalc(); }
function sellValues() {
  const f = $("#sellForm"); if (!f || !f.qty) return null;
  const it = Shop.item(f.dataset.item);
  const qty = Math.max(0, parseAmount(f.qty.value) || 0);
  const price = Math.max(0, parseAmount(f.price.value) || 0);
  return { f, it, qty, price, total: qty * price, cost: qty * it.cost, profit: qty * (price - it.cost) };
}
function sellCalc() {
  const v = sellValues(); if (!v) return;
  const row = (l, val, st) => '<div style="display:flex;justify-content:space-between;padding:3px 0;' + (st || "") + '"><span>' + l + '</span><b class="num">' + val + "</b></div>";
  $("#sellSum").innerHTML =
    row("Sotuv summasi", fmt(v.total), "font-size:13.5px;color:var(--ink-2)") +
    row("Tan narx (" + groupNum(v.qty, 0) + " × " + fmt(v.it.cost) + ")", "−" + fmt(v.cost), "font-size:13.5px;color:var(--ink-2)") +
    row("Foyda", fmt(v.profit), "border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-size:16px;font-weight:700;color:" + (v.profit >= 0 ? "var(--up)" : "var(--down)")) +
    '<div class="small muted" style="margin-top:6px">Sotuvdan keyin qoldiq: ' + groupNum(v.it.stock - v.qty, 0) + " " + esc(v.it.unit) + "</div>" +
    (v.qty > v.it.stock ? '<div class="small" style="color:var(--down);margin-top:4px">Skladda bunchalik mahsulot yo\'q</div>' : "");
}
function saveSell(e) {
  e.preventDefault();
  const v = sellValues(); const f = e.target;
  if (!v || !(v.qty > 0)) { toast("Miqdorni to'g'ri kiriting", "bad"); return false; }
  if (v.qty > v.it.stock) { toast("Skladda bunchalik mahsulot yo'q", "bad"); return false; }
  v.it.stock -= v.qty;
  shopDB().moves.push({
    id: uid(), itemId: v.it.id, kind: "sale", qty: v.qty, unitPrice: v.price, unitCost: v.it.cost,
    total: v.total, cost: v.cost, profit: v.profit,
    date: f.date.value || today(), time: nowTime(), note: f.note.value.trim()
  });
  persist(); closeModal(); render();
  toast("Sotildi · foyda " + fmt(v.profit), "ok");
  return false;
}
async function delMove(id) {
  const db = shopDB();
  const m = db.moves.find(x => x.id === id); if (!m) return;
  const it0 = Shop.item(m.itemId);
  const KIND = { in: "kirim", out: "chiqim", sale: "sotuv" };
  const back = m.kind === "in" ? "qoldiqdan " + groupNum(m.qty, 0) + " " + (it0 ? it0.unit : "dona") + " ayiriladi"
    : "qoldiqqa " + groupNum(m.qty, 0) + " " + (it0 ? it0.unit : "dona") + " qaytadi";
  if (!(await confirmDlg({
    title: "Bu " + KIND[m.kind] + " orqaga qaytarilsinmi?",
    text: (it0 ? "<b>" + esc(it0.name) + "</b> · " : "") + fmt(m.total) +
      "<br>" + back + (m.kind === "sale" ? ", foyda hisobidan " + fmt(m.profit) + " chiqariladi" : "") + ".",
    ok: "Ha, qaytarilsin", danger: true
  }))) return;
  const it = it0;
  if (it) {
    if (m.kind === "in") it.stock -= m.qty;
    else it.stock += m.qty;
  }
  db.moves = db.moves.filter(x => x.id !== id);
  persist(); render(); toast("Harakat o'chirildi", "ok");
}
function exportShopCsv() {
  const db = shopDB();
  const KIND = { in: "Kirim", out: "Chiqim", sale: "Sotuv" };
  const rows = db.moves.slice().sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || ""))).map(m => {
    const it = Shop.item(m.itemId);
    return {
      Sana: m.date, Vaqt: m.time || "", Mahsulot: it ? it.name : "", Turi: KIND[m.kind],
      Miqdor: m.qty, "Dona narx": m.kind === "sale" ? (m.unitPrice || 0) : (m.unitCost || 0),
      Summa: m.total, Foyda: m.kind === "sale" ? m.profit : 0, Izoh: m.note || ""
    };
  });
  if (!rows.length) { toast("Eksport uchun ma'lumot yo'q", "bad"); return; }
  const heads = Object.keys(rows[0]);
  const csv = "\uFEFF" + heads.join(";") + "\n" + rows.map(r => heads.map(h => '"' + String(r[h]).replace(/"/g, '""') + '"').join(";")).join("\n");
  download("moliyam-magazin-" + today() + ".csv", csv, "text/csv;charset=utf-8");
  toast("CSV fayl yuklandi", "ok");
}

<script>
"use strict";
/* ============================================================
   15c. KREDIT — to'liq to'lov grafigi
   Qoidalar:
   1) Foiz = oy boshidagi qoldiq × stavka ÷ yildagi kunlar × oydagi kunlar
      (kabisa yilida 366, oddiy yilda 365) yoki shartli 360 kun bazasi.
   2) Birinchi davrda faqat kredit berilgan kundan birinchi to'lov sanasigacha.
   3) Imtiyozli davrda faqat foiz to'lanadi, qoldiq o'zgarmaydi.
   4) Keyin: differensial (asosiy qarz teng bo'linadi) yoki annuitet
      A = S × i / (1 − (1+i)^(−n)), i = yillik stavka / 12.
   5) Foiz har doim o'sha oy boshidagi qoldiqdan.
   6) Har qatorda 2 xona; oxirgi qatorda qoldiq aniq 0.00 ga tushadi.
   Qo'shimcha: subsidiya, sug'urta/komissiya, muddatidan oldin to'lash.
   ============================================================ */
const r2 = (n) => Math.round(n * 100) / 100;
function fmtC(n) {
  const neg = n < 0; const p = Math.abs(n || 0).toFixed(2).split(".");
  return (neg ? "−" : "") + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ") + "." + p[1];
}
const CREDIT_METHODS = { diff: "Differensial", annuity: "Annuitet" };
const CREDIT_BASIS = { actual: "Haqiqiy kunlar (365/366)", "360": "Shartli 360 kun" };
const CREDIT_TYPES = { consumer: "Oddiy iste'mol", mortgage: "Ipoteka", auto: "Avtokredit", micro: "Mikroqarz" };
const EARLY_MODES = { term: "Muddat qisqaradi", payment: "Oylik to'lov kamayadi" };

function dayInMonth(anyDate, day) {
  const d = parseYmd(anyDate);
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  return ymd(new Date(d.getFullYear(), d.getMonth(), Math.min(day, last)));
}

const Credit = {
  list: () => (S.credits = S.credits || []),
  get: (id) => Credit.list().find(c => c.id === id),
  daysInYear: (y) => ((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0) ? 366 : 365,
  sub: (c) => c.sub || {},
  fees: (c) => c.fees || {},
  early: (c) => c.early || {},

  /* To'lov sanalari: oy oxiri yoki belgilangan kun */
  payDate(c, n) {
    if (!c.payDay) return n === 1 ? monthEnd(c.start) : monthEnd(addMonths(monthEnd(c.start), n - 1));
    let first = dayInMonth(c.start, c.payDay);
    if (first <= c.start) first = dayInMonth(addMonths(monthStart(c.start), 1), c.payDay);
    return n === 1 ? first : dayInMonth(addMonths(monthStart(first), n - 1), c.payDay);
  },

  /* opt: { noExtras: true } yoki { mode: "term" | "payment" } */
  schedule(c, opt) {
    opt = opt || {};
    const mode = opt.mode || Credit.early(c).mode || "term";
    const useExtras = !opt.noExtras;
    const sub = Credit.sub(c), fees = Credit.fees(c), early = Credit.early(c);
    const extras = {};
    if (useExtras) (early.list || []).forEach(x => { extras[x.n] = (extras[x.n] || 0) + x.amount; });
    const extraMonthly = useExtras ? (early.monthly || 0) : 0;
    const penaltyPct = early.penalty || 0;

    const rows = [];
    let bal = c.amount;
    const grace = Math.min(c.grace || 0, c.months - 1);
    const amort = c.months - grace;
    let annuity = null, diffPrincipal = c.amount / amort;
    let insMonthly = 0;

    for (let n = 1; n <= c.months && bal > 0.004; n++) {
      const date = Credit.payDate(c, n);
      const prev = n === 1 ? c.start : Credit.payDate(c, n - 1);
      const days = diffDays(prev, date);
      const year = parseYmd(date).getFullYear();
      const open = bal;

      /* foiz — shartnoma stavkasi bo'yicha */
      const full = c.basis === "360"
        ? open * c.rate / 100 / 12
        : open * c.rate / 100 / Credit.daysInYear(year) * days;
      /* subsidiya: qarzdor o'z stavkasini to'laydi, farqni davlat qoplaydi */
      const subOn = sub.enabled && c.rate > 0 && (!sub.months || n <= sub.months);
      const fullR = r2(full);
      const mine = r2(subOn ? full * (sub.rate / c.rate) : full);
      const state = r2(fullR - mine);

      /* asosiy qarz */
      let principal = 0;
      if (n > grace) {
        const leftMonths = Math.max(1, c.months - n + 1);
        if (c.method === "annuity") {
          if (annuity === null) { const i = c.rate / 1200; annuity = i > 0 ? open * i / (1 - Math.pow(1 + i, -amort)) : open / amort; }
          principal = annuity - full;
        } else principal = diffPrincipal;
        /* oxirgi qatorda qoldiq farqi shu to'lovga qo'shiladi — natija aniq 0.00 */
        if (n === c.months || principal > bal) principal = bal;
        if (principal < 0) principal = 0;
      }
      principal = r2(principal);
      bal = r2(bal - principal);

      /* muddatidan oldin to'lash — o'sha oy foizidan keyin asosiy qarzga */
      let extra = 0, penalty = 0;
      const want = (extras[n] || 0) + (n > 0 ? extraMonthly : 0);
      if (want > 0 && bal > 0) {
        extra = r2(Math.min(want, bal));
        if (penaltyPct) penalty = r2(bal * penaltyPct / 100);
        bal = r2(bal - extra);
        /* to'lovni kamaytirish stsenariysi — qolgan oylarga qayta taqsimlash */
        if (mode === "payment" && bal > 0) {
          const leftMonths = Math.max(1, c.months - n);
          if (c.method === "annuity") { const i = c.rate / 1200; annuity = i > 0 ? bal * i / (1 - Math.pow(1 + i, -leftMonths)) : bal / leftMonths; }
          else diffPrincipal = bal / leftMonths;
        }
      }

      /* sug'urta — har yili qoldiqdan qayta hisoblanadi, komissiya bir marta */
      if (fees.insurance && (n === 1 || (n - 1) % 12 === 0)) insMonthly = r2(open * fees.insurance / 100);
      const insNow = (fees.insurance && (n === 1 || (n - 1) % 12 === 0)) ? insMonthly : 0;
      let extraFee = insNow + (fees.monthly || 0) + penalty;
      if (n === 1) extraFee += (fees.commission || 0);
      extraFee = r2(extraFee);

      /* oxirgi qatorda qoldiq farqi yopiladi */
      if (bal > 0 && bal < 0.01) { principal = r2(principal + bal); bal = 0; }

      rows.push({
        n, date, days, open, close: bal, principal, extra, interest: mine,
        interestFull: fullR, state, fee: extraFee, penalty,
        total: r2(principal + extra + mine + extraFee)
      });
    }
    return rows;
  },

  summary(c, opt) {
    const rows = Credit.schedule(c, opt);
    if (!rows.length) return { rows: [], interest: 0, fee: 0, state: 0, total: 0, principal: 0, ear: 0, months: 0, over: 0,
      max: { total: 0, date: today() }, min: { total: 0, date: today() }, last: { close: 0 } };
    const sum = (k) => r2(rows.reduce((s, r) => s + r[k], 0));
    const interest = sum("interest"), fee = sum("fee"), state = sum("state");
    const total = sum("total"), principal = r2(sum("principal") + sum("extra"));
    let max = rows[0], min = rows[0];
    rows.forEach(r => { if (r.total > max.total) max = r; if (r.total < min.total) min = r; });
    /* samarali yillik stavka — barcha qo'shimcha xarajatlar bilan */
    const net = c.amount - (Credit.fees(c).commission || 0);
    const cf = [net].concat(rows.map(r => -r.total));
    const npv = (rate) => cf.reduce((s, v, i) => s + v / Math.pow(1 + rate, i), 0);
    let lo = 0, hi = 1;
    for (let k = 0; k < 120; k++) { const mid = (lo + hi) / 2; if (npv(mid) < 0) lo = mid; else hi = mid; }
    const im = (lo + hi) / 2;
    const ear = r2((Math.pow(1 + im, 12) - 1) * 100);
    return {
      rows, interest, fee, state, total, principal, max, min, ear,
      months: rows.length, over: c.amount ? r2((interest + fee) / c.amount * 100) : 0,
      last: rows[rows.length - 1] || { close: 0 }
    };
  },

  /* Asl grafik / muddat qisqaradi / to'lov kamayadi */
  compare(c) {
    return {
      base: Credit.summary(c, { noExtras: true }),
      term: Credit.summary(c, { mode: "term" }),
      payment: Credit.summary(c, { mode: "payment" })
    };
  },
  hasEarly: (c) => ((Credit.early(c).list || []).length > 0) || (Credit.early(c).monthly > 0),

  ltv: (c) => c.propertyValue ? r2(c.amount / c.propertyValue * 100) : 0,
  dti(c) { const s = Credit.summary(c); return c.income ? r2(s.max.total / c.income * 100) : 0; },

  paid: (c) => (c.payments || []).reduce((s, p) => s + p.amount, 0),
  paidPrincipal: (c) => (c.payments || []).reduce((s, p) => s + (p.principal || 0) + (p.extra || 0), 0),
  paidInterest: (c) => (c.payments || []).reduce((s, p) => s + (p.interest || 0), 0),
  remaining: (c) => r2(Math.max(0, c.amount - Credit.paidPrincipal(c))),
  isPaid: (c, n) => (c.payments || []).some(p => p.n === n),
  nextRow(c) { return Credit.schedule(c).find(r => !Credit.isPaid(c, r.n)) || null; },
  status(c) {
    const nx = Credit.nextRow(c);
    if (!nx) return { key: "closed", label: "To'liq yopilgan", cls: "up" };
    if (nx.date < today()) return { key: "overdue", label: "To'lov kechikkan", cls: "down" };
    if (nx.date === today()) return { key: "due", label: "Bugun to'lov kuni", cls: "warn" };
    if ((c.payments || []).length) return { key: "active", label: "To'lanmoqda", cls: "neutral" };
    return { key: "new", label: "Yangi", cls: "neutral" };
  },
  monthDue(c) {
    const mk = monthKey(today());
    return Credit.schedule(c).filter(r => monthKey(r.date) === mk && !Credit.isPaid(c, r.n)).reduce((s, r) => s + r.total, 0);
  },
  alerts() {
    const out = [];
    for (const c of Credit.list()) {
      const nx = Credit.nextRow(c); if (!nx) continue;
      const d = diffDays(today(), nx.date);
      if (d < 0) out.push({ c, row: nx, days: d, kind: "overdue" });
      else if (d <= (c.remindDays == null ? 3 : c.remindDays)) out.push({ c, row: nx, days: d, kind: "soon" });
    }
    return out;
  }
};

/* ---------- Ko'rinish ---------- */
Views.credits = function () {
  const list = Credit.list().slice().sort((a, b) => (Credit.remaining(b) > 0 ? 1 : 0) - (Credit.remaining(a) > 0 ? 1 : 0));
  const totalLeft = list.reduce((s, c) => s + toMain(Credit.remaining(c), c.currency), 0);
  const monthDue = list.reduce((s, c) => s + toMain(Credit.monthDue(c), c.currency), 0);
  const planInt = list.reduce((s, c) => s + toMain(Credit.summary(c).interest, c.currency), 0);
  const stateTotal = list.reduce((s, c) => s + toMain(Credit.summary(c).state, c.currency), 0);

  return head("Kredit", "To'lov grafigi, subsidiya, sug'urta va muddatidan oldin to'lash hisobi",
    '<button class="btn btn-primary" onclick="creditModal()">' + ico("plus", 16, 2.4) + " Kredit qo'shish</button>") +

    (list.length ? '<div class="grid g-4" style="margin-bottom:16px">' +
      '<div class="card stat"><div class="t">' + ico("bank", 16) + 'Kredit qoldig\'i</div><div class="v num">' + fmt(totalLeft) + '</div><div class="d">' + list.length + " ta kredit</div></div>" +
      '<div class="card stat"><div class="t">' + ico("cal", 16) + 'Bu oy to\'lov</div><div class="v num">' + fmt(monthDue) + '</div><div class="d">To\'lanmagan qismi</div></div>' +
      '<div class="card stat"><div class="t">' + ico("arrowOut", 16) + 'Reja bo\'yicha foiz</div><div class="v num" style="color:var(--down)">' + fmt(planInt) + '</div><div class="d">Butun muddat uchun</div></div>' +
      (stateTotal > 0
        ? '<div class="card stat"><div class="t">' + ico("shield", 16) + 'Davlat qoplaydi</div><div class="v num" style="color:var(--up)">' + fmt(stateTotal) + '</div><div class="d">Subsidiya jami</div></div>'
        : '<div class="card stat"><div class="t">' + ico("alert", 16) + 'Ortiqcha to\'lov</div><div class="v num">' + (list.length ? groupNum(Credit.summary(list[0]).over, 2) + "%" : "—") + '</div><div class="d">Birinchi kredit bo\'yicha</div></div>') + "</div>" : "") +

    (list.length ? '<div class="grid g-2">' + list.map(c => {
      const s = Credit.summary(c), st = Credit.status(c), nx = Credit.nextRow(c);
      const left = Credit.remaining(c);
      const pct = c.amount ? clamp(Credit.paidPrincipal(c) / c.amount * 100, 0, 100) : 0;
      const days = nx ? diffDays(today(), nx.date) : null;
      return '<div class="card card-pad">' +
        '<div style="display:flex;align-items:flex-start;gap:11px">' +
        '<span class="tint" style="background:var(--teal-100);color:var(--teal-700)">' + ico("bank", 18) + "</span>" +
        '<div style="min-width:0;flex:1"><div style="font-weight:650;font-size:15.5px">' + esc(c.name) + "</div>" +
        '<div class="small muted">' + CREDIT_TYPES[c.type || "consumer"] + " · " + fmt(c.amount, c.currency) + " · " + groupNum(c.rate, 1) + "% · " + c.months + " oy · " + CREDIT_METHODS[c.method] + "</div></div>" +
        '<span class="pill ' + st.cls + '">' + st.label + "</span></div>" +

        '<div style="display:flex;align-items:flex-end;justify-content:space-between;margin:14px 0 8px">' +
        '<div><div class="small muted">Qolgan asosiy qarz</div><div class="num" style="font-size:22px;font-weight:700">' + fmt(left, c.currency) + "</div></div>" +
        '<div style="text-align:right"><div class="small muted">To\'langan / jami</div>' +
        '<div class="num small">' + (c.payments || []).length + " / " + s.months + " oy</div></div></div>" +
        '<div class="bar ' + (pct >= 100 ? "ok" : "") + '"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +

        (nx ? '<div style="display:flex;gap:14px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-2)">' +
          '<div><div class="small muted">Keyingi to\'lov</div><div style="font-weight:650">' + fmtC(nx.total) + "</div>" +
          '<div class="small ' + (days < 0 ? "" : "muted") + '" style="' + (days < 0 ? "color:var(--down);font-weight:600" : days <= 3 ? "color:var(--warn);font-weight:600" : "") + '">' + longDate(nx.date) +
          " · " + (days < 0 ? Math.abs(days) + " kun kechikkan" : days === 0 ? "bugun" : days + " kun qoldi") + "</div></div>" +
          '<div style="text-align:right;margin-left:auto"><div class="small muted">shundan foiz</div>' +
          '<div class="num small">' + fmtC(nx.interest) + '</div><div class="small muted">asosiy: ' + fmtC(nx.principal) +
          (nx.fee ? " · xarajat: " + fmtC(nx.fee) : "") + "</div></div></div>"

function parseExtras(str) {
  return String(str || "").split(",").map(x => {
    const p = x.split(":");
    const n = Math.round(parseAmount(p[0]) || 0), a = parseAmount(p[1]) || 0;
    return n > 0 && a > 0 ? { n, amount: a } : null;
  }).filter(Boolean);
}
function credValues() {
  const f = $("#credForm"); if (!f || !f.amount) return null;
  const grant = parseAmount(f.subGrant.value) || 0;
  const raw = parseAmount(f.amount.value) || 0;
  return {
    f, name: f.name.value.trim(), type: f.type.value,
    amount: Math.max(0, raw - grant), rawAmount: raw, grant,
    rate: parseAmount(f.rate.value) || 0,
    months: Math.max(1, Math.round(parseAmount(f.months.value) || 0)),
    grace: Math.max(0, Math.round(parseAmount(f.grace.value) || 0)),
    start: f.start.value || today(), payDay: +f.payDay.value || 0,
    remindDays: Math.max(0, Math.round(parseAmount(f.remindDays.value) || 0)),
    method: f.dataset.method, basis: f.basis.value, currency: f.currency.value,
    propertyValue: parseAmount(f.propertyValue.value) || 0,
    downPayment: parseAmount(f.downPayment.value) || 0,
    income: parseAmount(f.income.value) || 0,
    sub: { enabled: f.subOn.checked, rate: parseAmount(f.subRate.value) || 0, months: Math.round(parseAmount(f.subMonths.value) || 0), grant: grant },
    fees: { commission: parseAmount(f.commission.value) || 0, insurance: parseAmount(f.insurance.value) || 0, monthly: parseAmount(f.monthlyFee.value) || 0 },
    early: { list: parseExtras(f.extras.value), monthly: parseAmount(f.extraMonthly.value) || 0, penalty: parseAmount(f.penalty.value) || 0, mode: f.dataset.emode }
  };
}
function credCalc() {
  const v = credValues(); if (!v) return;
  const box = $("#credSum"); if (!box) return;
  if (!(v.amount > 0) || !(v.months > 0)) { box.innerHTML = '<span class="small muted">Summani va muddatni kiriting — hisob shu yerda chiqadi.</span>'; return; }
  const s = Credit.summary(v);
  const row = (l, val, st) => '<div style="display:flex;justify-content:space-between;padding:3px 0;' + (st || "") + '"><span>' + l + '</span><b class="num">' + val + "</b></div>";
  let html =
    (v.grant ? row("Boshlang'ich badal subsidiyasi", "−" + fmtC(v.grant), "font-size:13.5px;color:var(--up)") +
      row("Grafik tuziladigan summa", fmtC(v.amount), "font-size:13.5px;color:var(--ink-2)") : "") +
    row("Jami to'lanadigan foiz", fmtC(s.interest), "font-size:13.5px;color:var(--ink-2)") +
    (s.fee ? row("Sug'urta va komissiya", fmtC(s.fee), "font-size:13.5px;color:var(--ink-2)") : "") +
    (s.state ? row("Davlat qoplaydi", fmtC(s.state), "font-size:13.5px;color:var(--up)") : "") +
    row("Jami to'lov summasi", fmtC(s.total), "font-size:15px;font-weight:650;border-top:1px solid var(--line);margin-top:6px;padding-top:8px") +
    row("Ortiqcha to'lov", groupNum(s.over, 2) + "%", "font-size:13.5px;color:var(--warn)") +
    row("Samarali yillik stavka", groupNum(s.ear, 2) + "%", "font-size:13.5px;color:var(--warn)") +
    '<div class="small muted" style="margin-top:6px">Eng yuqori oylik: <b class="num" style="color:var(--ink)">' + fmtC(s.max.total) + "</b> (" + longDate(s.max.date) + ")" +
    " · eng past: <b class=\"num\" style=\"color:var(--ink)\">" + fmtC(s.min.total) + "</b></div>" +
    '<div class="small muted" style="margin-top:3px">Birinchi to\'lov ' + longDate(s.rows[0].date) + " (" + s.rows[0].days + " kun uchun " + fmtC(s.rows[0].interest) + ")" +
    (v.grace ? " · imtiyozli davr " + v.grace + " oy" : "") + " · jami " + s.months + " oy</div>";
  if (v.propertyValue) html += '<div class="small muted" style="margin-top:3px">LTV: <b style="color:var(--ink)">' + groupNum(Credit.ltv(v), 2) + "%</b>" +
    (v.income ? " · DTI: <b style=\"color:" + (Credit.dti(v) > 50 ? "var(--down)" : "var(--ink)") + "\">" + groupNum(Credit.dti(v), 2) + "%</b> (eng yuqori to'lov daromadning shuncha qismi)" : "") + "</div>";
  if (Credit.hasEarly(v)) {
    const cmp = Credit.compare(v);
    html += '<div class="small" style="margin-top:6px;color:var(--up)">Muddat qisqarsa: ' + cmp.term.months + " oy (" + (cmp.base.months - cmp.term.months) + " oy kam), foiz tejami " + fmtC(cmp.base.interest - cmp.term.interest) + "</div>" +
      '<div class="small" style="color:var(--up)">To\'lov kamaysa: foiz tejami ' + fmtC(cmp.base.interest - cmp.payment.interest) + "</div>";
  }
  box.innerHTML = html;
}
function previewSchedule() {
  const v = credValues(); if (!v || !(v.amount > 0)) { toast("Avval summani kiriting", "bad"); return; }
  showSchedule(Object.assign({ id: "preview", payments: [] }, v), true);
}
function saveCredit(e, id) {
  e.preventDefault();
  const v = credValues(); const f = e.target;
  if (!v.name) { toast("Kredit nomini kiriting", "bad"); return false; }
  if (!(v.amount > 0)) { toast("Iltimos, summani to'g'ri kiriting", "bad"); return false; }
  if (v.grace >= v.months) { toast("Imtiyozli davr muddatdan qisqa bo'lishi kerak", "bad"); return false; }
  if (v.sub.enabled && v.sub.rate > v.rate) { toast("Qarzdor stavkasi shartnoma stavkasidan katta bo'lmasin", "bad"); return false; }
  const rec = {
    id: id || uid(), name: v.name, type: v.type, amount: v.amount, rate: v.rate, months: v.months,
    grace: v.grace, start: v.start, payDay: v.payDay, remindDays: v.remindDays,
    method: v.method, basis: v.basis, currency: v.currency,
    propertyValue: v.propertyValue, downPayment: v.downPayment, income: v.income,
    sub: v.sub, fees: v.fees, early: v.early,
    payments: [], createdAt: new Date().toISOString()
  };
  const list = Credit.list();
  if (id) { const i = list.findIndex(x => x.id === id); rec.payments = list[i].payments || []; rec.createdAt = list[i].createdAt; list[i] = rec; }
  else {
    list.push(rec);
    if (f.link && f.link.checked && f.accountId) {
      S.transactions.push({
        id: uid(), type: "income", kind: "credit", amount: v.amount, accountId: f.accountId.value,
        categoryId: null, date: v.start, time: nowTime(), note: "Kredit olindi: " + v.name,
        tags: [], creditId: rec.id, createdAt: new Date().toISOString()
      });
    }
  }
  persist(); closeModal(); renderNav(); render(); toast(id ? "Kredit yangilandi" : "Kredit qo'shildi", "ok");
  return false;
}
async function delCredit(id) {
  const c = Credit.get(id);
  if (!(await confirmDlg({
    title: "Kredit o'chirilsinmi?",
    text: "<b>" + esc(c.name) + "</b> va uning to'lovlar tarixi o'chiriladi.", ok: "O'chirish", danger: true
  }))) return;
  S.credits = Credit.list().filter(x => x.id !== id);
  S.transactions = S.transactions.filter(t => t.creditId !== id);

}

function creditVerdict(c, s, cmp) {
  const out = [];
  out.push("Kredit tanasi " + fmtC(c.amount) + ", ustiga " + fmtC(s.interest) + " foiz" +
    (s.fee ? " va " + fmtC(s.fee) + " qo'shimcha xarajat" : "") + " qo'shiladi — bu asosiy qarzning " + groupNum(s.over, 2) + " foizi.");
  if (s.state) out.push("Davlat subsidiyasi hisobiga " + fmtC(s.state) + " tejaladi; subsidiya tugagach to'lov keskin oshadi, shuning uchun o'sha oyga oldindan tayyorgarlik ko'ring.");
  if ((c.grace || 0) > 0) out.push("Dastlabki " + c.grace + " oy imtiyozli davr: qoldiq kamaymaydi, shu davrda faqat foiz ketadi — eng ko'p pul aynan shu yerda \"yo'qoladi\".");
  out.push("Eng og'ir oy — " + longDate(s.max.date) + ": " + fmtC(s.max.total) + ". Byudjetni shu raqamga qarab tuzing.");
  if (cmp && Credit.hasEarly(c)) {
    const term = cmp.base.interest - cmp.term.interest, pay = cmp.base.interest - cmp.payment.interest;
    out.push(term >= pay
      ? "Qo'shimcha to'lovlarda \"muddat qisqarishi\" foydaliroq: " + fmtC(term) + " foiz tejaladi va grafik " + (cmp.base.months - cmp.term.months) + " oy erta tugaydi."
      : "Bu shartlarda \"oylik to'lov kamayishi\" ko'proq tejaydi: " + fmtC(pay) + " foiz, ammo muddat o'zgarmaydi.");
  } else out.push("Muddatidan oldin to'lash imkoni bo'lsa, har qo'shimcha so'm keyingi barcha oylar foizini kamaytiradi — eng katta samara imtiyozli davrdan keyingi dastlabki yillarda bo'ladi.");
  if (c.income) out.push("Eng yuqori to'lov daromadingizning " + groupNum(Credit.dti(c), 2) + " foizini egallaydi" + (Credit.dti(c) > 50 ? " — bu xavfli chegara, 50% dan pastga tushirish tavsiya etiladi." : "."));
  return out.slice(0, 5);
}

function exportSchedule(id) {
  const c = id === "preview" ? Object.assign({ payments: [] }, credValues()) : Credit.get(id);

  const csv = "\uFEFF" + heads.join(";") + "\n" +
    rows.map(r => [r.n, r.date, r.days, r.close.toFixed(2), (r.principal + r.extra).toFixed(2),
      r.interest.toFixed(2), r.fee.toFixed(2), r.state.toFixed(2), r.total.toFixed(2)].join(";")).join("\n");

}

/* ---------- To'lov qilish ---------- */
function payCreditModal(id) {
  const c = Credit.get(id), nx = Credit.nextRow(c);
  if (!nx) { toast("Bu kredit to'liq yopilgan", "ok"); return; }
  const mode = (Credit.early(c).mode) || "term";
  openModal(modalHead("Kredit to'lovi", c.name + " · " + nx.n + "-to'lov, " + longDate(nx.date)) +
    '<form class="modal-body" id="credPayForm" data-credit="' + id + '" data-n="' + nx.n + '" data-pmode="' + mode + '" onsubmit="return saveCreditPay(event)">' +

    '<div class="field"><label for="cpAmt">To\'lanayotgan summa</label>' +
    '<input class="input amount-input" id="cpAmt" name="amount" inputmode="decimal" data-autofocus value="' + groupNum(nx.total, 2) + '" oninput="fmtAmountInput(this);credPayCalc()"></div>' +
    '<div class="chips" style="margin-bottom:14px">' +
    '<button type="button" class="chip" onclick="setPayAmt(0)">Reja bo\'yicha</button>' +
    [500000, 1000000, 5000000].map(x => '<button type="button" class="chip" onclick="setPayAmt(' + x + ')">+' + fmtShort(x, c.currency) + "</button>").join("") +
    '<button type="button" class="chip" onclick="setPayAmt(-1)">Kreditni to\'liq yopish</button></div>' +

    '<div id="cpSum" style="background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:14px"></div>' +

    '<div class="field" id="cpModeWrap" hidden><label>Ortiqcha to\'lov nimaga ishlatilsin?</label><div class="seg">' +
    Object.keys(EARLY_MODES).map(k => '<button type="button" data-v="' + k + '" class="' + (k === mode ? "on" : "") + '" onclick="segPick(this,\'pmode\');credPayCalc()">' + EARLY_MODES[k] + "</button>").join("") + "</div></div>" +

    '<div class="field"><label>To\'lov sanasi</label><input type="date" class="input" name="date" value="' + today() + '"></div>' +
    (S.accounts.length ? '<label class="set-row" style="border:0"><input type="checkbox" name="link" checked>' +
      '<span class="t"><b>Hisobdan yechilsin</b><span>Balansdan ayiriladi, xarajat statistikasiga kirmaydi</span></span></label>' +
      '<div class="field">' + accSelect("accountId") + "</div>" : "") +
    '<div class="field"><label>Izoh</label><input class="input" name="note" placeholder="Ixtiyoriy"></div>' +
    "</form>" +
    '<div class="modal-foot"><button class="btn" onclick="closeModal()">Bekor qilish</button>' +
    '<button class="btn btn-primary" onclick="document.getElementById(\'credPayForm\').requestSubmit()">To\'lovni saqlash</button></div>');
  credPayCalc();
}
function setPayAmt(add) {
  const f = $("#credPayForm"); if (!f) return;
  const c = Credit.get(f.dataset.credit), n = +f.dataset.n;
  const row = Credit.schedule(c).find(r => r.n === n);
  const val = add === -1 ? r2(row.total + row.close) : r2(row.total + Math.max(0, add));
  f.amount.value = groupNum(val, 2);
  credPayCalc();
}
/* Ortiqcha to'lov asosiy qarzni qanchaga kamaytirishini jonli hisoblaydi */
function credPayValues() {
  const f = $("#credPayForm"); if (!f || !f.amount) return null;
  const c = Credit.get(f.dataset.credit); if (!c) return null;
  const n = +f.dataset.n;
  const base = Credit.summary(c);
  const row = base.rows.find(r => r.n === n) || base.rows[0];
  const paid = Math.max(0, parseAmount(f.amount.value) || 0);
  const diff = r2(paid - row.total);
  const extra = diff > 0.5 ? diff : 0;   /* tiyin farqi ortiqcha to'lov hisoblanmaydi */
  const short = diff < -0.5 ? r2(-diff) : 0;
  let after = base, newRow = row;
  if (extra > 0) {
    const tmp = JSON.parse(JSON.stringify(c));
    tmp.early = Object.assign({ list: [], monthly: 0, penalty: 0 }, tmp.early || {}, { mode: f.dataset.pmode });
    tmp.early.list = (tmp.early.list || []).concat([{ n: n, amount: extra }]);
    after = Credit.summary(tmp);
    newRow = after.rows.find(r => r.n === n) || row;
  }
  return {
    f, c, n, row, newRow, paid, extra, short, base, after,
    mode: f.dataset.pmode,
    saveInterest: r2(base.interest - after.interest),
    cutMonths: base.months - after.months,
    nextTotal: (after.rows.find(r => r.n === n + 1) || {}).total
  };
}
function credPayCalc() {
  const v = credPayValues(); if (!v) return;
  const box = $("#cpSum"); if (!box) return;
  const wrap = $("#cpModeWrap"); if (wrap) wrap.hidden = !(v.extra > 0);
  const cur = v.c.currency;
  const line = (l, val, opt) => {
    opt = opt || {};
    return '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:' + (opt.big ? "8px 0 2px" : "3px 0") + ";" +
      (opt.top ? "border-top:1px solid var(--line);margin-top:6px;padding-top:8px;" : "") + '">' +
      '<span style="font-size:' + (opt.big ? "14px;font-weight:650;color:var(--ink)" : "13.5px;color:var(--ink-2)") + '">' + l + "</span>" +
      '<b class="num" style="font-size:' + (opt.big ? "16px" : "13.5px") + ";color:" + (opt.color || "var(--ink)") + '">' + val + "</b></div>";
  };
  let html =
    line("Reja bo'yicha to'lov", fmtC(v.row.total)) +
    line("Shundan foiz", fmtC(v.row.interest), { color: "var(--down)" }) +
    line("Shundan asosiy qarz", fmtC(v.row.principal)) +
    (v.row.fee ? line("Sug'urta / komissiya", fmtC(v.row.fee)) : "");

  if (v.extra > 0) {
    html += line("Ortiqcha to'lov — asosiy qarzga", "+" + fmtC(v.extra), { color: "var(--up)", top: true }) +
      (v.newRow.fee > v.row.fee ? line("Erta to'lash jarimasi", fmtC(v.newRow.fee - v.row.fee), { color: "var(--down)" }) : "") +
      line("Asosiy qarz: hozir → to'lovdan keyin",
        fmtC(v.row.open) + " → " + fmtC(v.newRow.close), { big: true, top: true, color: "var(--up)" }) +
      '<div class="small" style="margin-top:6px;color:var(--up);line-height:1.55">' +
      "Reja bo'yicha qoldiq " + fmtC(v.row.close) + " bo'lardi — ortiqcha to'lov uni yana <b>" + fmtC(v.row.close - v.newRow.close) + "</b> ga kamaytiradi.<br>" +
      "Kelgusi foizdan tejam: <b>" + fmtC(v.saveInterest) + "</b>" +
      (v.mode === "term"
        ? (v.cutMonths > 0 ? " · muddat <b>" + v.cutMonths + " oy</b> qisqaradi (" + v.base.months + " → " + v.after.months + ")" : " · muddat o'zgarmaydi")
        : (v.nextTotal != null ? " · keyingi oylik to'lov <b>" + fmtC(v.nextTotal) + "</b> ga tushadi" : "")) + "</div>";
  } else {
    html += line("To'lovdan keyingi qoldiq", fmtC(v.row.close), { big: true, top: true });
    if (v.short > 0) html += '<div class="small" style="margin-top:6px;color:var(--down)">Reja summasidan ' + fmtC(v.short) +
      " kam. Kam to'lansa, farq keyingi oylarga qoladi va foiz ko'payadi.</div>";
    else html += '<div class="small muted" style="margin-top:6px">Rejadan ko\'p to\'lasangiz, ortiqcha qism to\'liq asosiy qarzga tushadi va shu yerda hisoblab ko\'rsatiladi.</div>';
  }
  box.innerHTML = html;
}
function saveCreditPay(e) {
  e.preventDefault();
  const v = credPayValues();
  if (!v || !(v.paid > 0)) { toast("Iltimos, summani to'g'ri kiriting", "bad"); return false; }
  const f = e.target, c = v.c;
  if (v.extra > 0) {
    c.early = Object.assign({ list: [], monthly: 0, penalty: 0 }, c.early || {}, { mode: v.mode });
    const same = (c.early.list || []).find(x => x.n === v.n);
    if (same) same.amount = r2(same.amount + v.extra);
    else c.early.list.push({ n: v.n, amount: v.extra });
  }
  c.payments = c.payments || [];
  c.payments.push({
    id: uid(), n: v.n, date: f.date.value || today(), amount: v.paid,
    principal: v.row.principal, extra: v.extra, interest: v.row.interest, fee: v.newRow.fee, note: f.note.value.trim()
  });
  if (f.link && f.link.checked && f.accountId) {
    S.transactions.push({
      id: uid(), type: "expense", kind: "credit", amount: v.paid, accountId: f.accountId.value, categoryId: null,
      date: f.date.value || today(), time: nowTime(),
      note: "Kredit to'lovi: " + c.name + " (" + v.n + "-oy" + (v.extra > 0 ? ", +" + fmtC(v.extra) + " asosiy qarzga" : "") + ")",
      tags: [], creditId: c.id, createdAt: new Date().toISOString()
    });
  }
  persist(); closeModal(); renderNav(); render();
  toast(Credit.remaining(c) <= 0 ? "Kredit to'liq yopildi"
    : v.extra > 0 ? "To'lov saqlandi · asosiy qarz " + fmtC(v.extra) + " ga qo'shimcha kamaydi" : "To'lov saqlandi", "ok");
  return false;
}

<script>
"use strict";
/* ============================================================

   ============================================================ */
const RANGES = {
  week: "Bu hafta", month: "Bu oy", last: "O'tgan oy", m3: "Oxirgi 3 oy",
  m6: "Oxirgi 6 oy", year: "Bu yil", custom: "Tanlangan davr"
};
function rangeDates() {
  const t = today();
  switch (UI.statRange) {
    case "week": { const d = new Date(); const dow = (d.getDay() + 6) % 7; return [addDays(t, -dow), t]; }
    case "last": { const p = addMonths(t, -1); return [monthStart(p), monthEnd(p)]; }
    case "m3": return [monthStart(addMonths(t, -2)), t];
    case "m6": return [monthStart(addMonths(t, -5)), t];
    case "year": return [t.slice(0, 4) + "-01-01", t];
    case "custom": return [UI.statFrom || monthStart(t), UI.statTo || t];
    default: return [monthStart(t), monthEnd(t)];
  }
}
function buckets(from, to) {
  const span = diffDays(from, to);
  const out = [];
  if (span <= 62) {
    for (let d = from; d <= to; d = addDays(d, 1)) {
      const day = S.transactions.filter(t => t.date === d && (t.kind || "normal") === "normal");
      const s = Calc.sums(day);
      out.push({ label: parseYmd(d).getDate() + "", key: d, a: s.income, b: s.expense, net: s.net });
    }
  } else {
    let m = monthKey(from);
    while (m <= monthKey(to)) {
      const s = Calc.sums(Calc.range(m + "-01", monthEnd(m + "-01")));
      out.push({ label: MONTHS_SHORT[+m.split("-")[1] - 1], key: m, a: s.income, b: s.expense, net: s.net });
      m = monthKey(addMonths(m + "-01", 1));
    }
  }
  return out;
}
Views.stats = function () {
  const [from, to] = rangeDates();
  const list = Calc.range(from, to);
  const s = Calc.sums(list);
  const days = Math.max(1, diffDays(from, to) + 1);
  const expCats = Calc.byCategory(list, "expense");
  const incCats = Calc.byCategory(list, "income");
  const bs = buckets(from, to);
  const chip = (k) => '<button class="chip' + (UI.statRange === k ? " on" : "") + '" onclick="setRange(\'' + k + '\')">' + RANGES[k] + "</button>";

  return head("Statistika", longDate(from) + " — " + longDate(to),
    '<button class="btn" onclick="window.print()">' + ico("file", 16) + " Chop etish</button>") +
    '<div class="card card-pad" style="margin-bottom:16px"><div class="chips">' +
    Object.keys(RANGES).filter(k => k !== "custom").map(chip).join("") + chip("custom") +
    '<span style="display:flex;gap:8px;align-items:center;margin-left:auto">' +
    '<input type="date" class="input" style="width:160px" value="' + (UI.statFrom || from) + '" onchange="UI.statFrom=this.value;UI.statRange=\'custom\';render()">' +
    '<span class="muted">—</span>' +
    '<input type="date" class="input" style="width:160px" value="' + (UI.statTo || to) + '" onchange="UI.statTo=this.value;UI.statRange=\'custom\';render()"></span></div></div>' +

    '<div class="grid g-4" style="margin-bottom:16px">' +
    '<div class="card stat"><div class="t">Jami kirim</div><div class="v num" style="color:var(--up)">' + fmt(s.income) + '</div><div class="d">' + list.filter(t => t.type === "income").length + " ta operatsiya</div></div>" +
    '<div class="card stat"><div class="t">Jami chiqim</div><div class="v num" style="color:var(--down)">' + fmt(s.expense) + '</div><div class="d">' + list.filter(t => t.type === "expense").length + " ta operatsiya</div></div>" +
    '<div class="card stat"><div class="t">Sof pul oqimi</div><div class="v num">' + fmt(s.net) + '</div><div class="d">' + (s.income ? Math.round(s.net / s.income * 100) + "% jamg'arma darajasi" : "—") + "</div></div>" +
    '<div class="card stat"><div class="t">O\'rtacha kunlik xarajat</div><div class="v num">' + fmt(s.expense / days) + '</div><div class="d">Oyiga taxminan ' + fmtShort(s.expense / days * 30) + "</div></div></div>" +

    '<div class="card" style="margin-bottom:16px"><div class="card-head"><h3>Kirim va chiqim dinamikasi</h3><span class="sub">' + (bs.length > 31 ? "oylar kesimida" : "kunlar kesimida") + "</span></div>" +
    '<div class="card-pad">' + Chart.bars(bs, { height: 230 }) + "</div></div>" +

    '<div class="card-pad">' + Chart.area(bs.map(b => ({ label: b.label, v: b.net })), { height: 200 }) + "</div></div>" +

    '<div class="grid g-2" style="margin-bottom:16px">' +

    '<div class="card"><div class="card-head"><h3>Eng katta xarajatlar</h3><span class="sub">Top 10</span></div>' +
    "<table><thead><tr><th>Sana</th><th>Kategoriya</th><th>Izoh</th><th style=\"text-align:right\">Summa</th></tr></thead><tbody>" +
    list.filter(t => t.type === "expense").sort((a, b) => Calc.main(b) - Calc.main(a)).slice(0, 10).map(t =>
      "<tr><td>" + humanDate(t.date) + "</td><td>" + esc(txnTitle(t)) + '</td><td class="muted small">' + esc(t.note || "—") + "</td>" +
      '<td class="amt out">' + fmt(Calc.main(t)) + "</td></tr>").join("") + "</tbody></table></div>";
};

  const picker = tab === "month"

      '<button class="icon-btn" aria-label="Keyingi kun" onclick="shiftReportDay(1)">›</button>' +
      '<button class="btn btn-sm" onclick="UI.reportDay=today();render()">Bugun</button></div>';
  return head("Hisobotlar", tab === "month" ? "Oylik moliyaviy hisobot — chop etish yoki eksport uchun tayyor" : "Kunlik hisobot — kun va soatlar kesimida",
    picker +
    '<button class="btn no-print" onclick="exportCsv()">CSV</button>' +
    '<button class="btn no-print" onclick="exportExcel()">Excel</button>' +
    '<button class="btn btn-primary no-print" onclick="window.print()">' + ico("file", 16) + " PDF / chop etish</button>") +
    '<div class="seg no-print" style="max-width:330px;margin-bottom:16px">' + seg("month", "Oylik hisobot") + seg("day", "Kunlik hisobot") + "</div>" +
    (tab === "day" ? reportDaily() : reportMonthly());
};
function shiftReportDay(n) { UI.reportDay = addDays(UI.reportDay || today(), n); render(); }

/* ---------- Oylik hisobot ---------- */

    '<div class="brand-mark" style="background:var(--teal-700)"><svg width="20" height="20" viewBox="0 0 64 64"><path d="M32 12c8 0 14 6 14 14v26H18V26c0-8 6-14 14-14z" fill="none" stroke="#F2C14E" stroke-width="5"/><path d="M32 27v17M25 34h14" stroke="#F2C14E" stroke-width="5" stroke-linecap="round"/></svg></div>' +
    '<div><h2 style="font-size:19px">Moliyaviy hisobot — ' + monthLabel(mk) + "</h2>" +
    '<div class="small muted">Tayyorlangan sana: ' + longDate(today()) + " · Moliyam v" + APP_VERSION + "</div></div>" +
    '<div style="margin-left:auto;text-align:right"><div class="small muted">Oy yakuni</div>' +
    '<div class="num" style="font-size:21px;font-weight:700;color:' + (s.net >= 0 ? "var(--up)" : "var(--down)") + '">' + fmt(s.net) + "</div></div></div>" +

    '<div class="grid g-4" style="margin-bottom:18px">' +
    '<div><div class="small muted">Kirim</div><div class="num" style="font-size:19px;font-weight:700;color:var(--up)">' + fmt(s.income) + "</div></div>" +
    '<div><div class="small muted">Chiqim</div><div class="num" style="font-size:19px;font-weight:700;color:var(--down)">' + fmt(s.expense) + "</div></div>" +
    '<div><div class="small muted">O\'tgan oy sof oqimi</div><div class="num" style="font-size:19px;font-weight:700">' + fmt(prev.net) + "</div></div>" +
    '<div><div class="small muted">Operatsiyalar soni</div><div class="num" style="font-size:19px;font-weight:700">' + list.length + "</div></div></div>" +

    "<h3 style=\"font-size:15px;margin-bottom:9px\">Xarajatlar kategoriyalar bo'yicha</h3>" +
    (expCats.length ? "<table><thead><tr><th>Kategoriya</th><th style=\"text-align:right\">Summa</th><th style=\"text-align:right\">Ulush</th><th style=\"text-align:right\">Operatsiya</th></tr></thead><tbody>" +
      expCats.map(c => "<tr><td>" + c.icon + " " + esc(c.name) + '</td><td class="amt">' + fmt(c.value) + "</td>" +
        '<td class="amt">' + Math.round(c.value / (s.expense || 1) * 100) + '%</td><td class="amt">' + list.filter(t => t.type === "expense" && (t.categoryId || "none") === c.id).length + "</td></tr>").join("") +
      '<tr style="font-weight:700"><td>Jami</td><td class="amt">' + fmt(s.expense) + '</td><td class="amt">100%</td><td class="amt">' + list.filter(t => t.type === "expense").length + "</td></tr></tbody></table>"
      : '<p class="muted small">Bu oyda xarajat qayd etilmagan.</p>') +

    "<h3 style=\"font-size:15px;margin:20px 0 9px\">Daromadlar</h3>" +
    (incCats.length ? "<table><thead><tr><th>Manba</th><th style=\"text-align:right\">Summa</th><th style=\"text-align:right\">Ulush</th></tr></thead><tbody>" +
      incCats.map(c => "<tr><td>" + c.icon + " " + esc(c.name) + '</td><td class="amt">' + fmt(c.value) + "</td>" +
        '<td class="amt">' + Math.round(c.value / (s.income || 1) * 100) + "%</td></tr>").join("") +
      '<tr style="font-weight:700"><td>Jami</td><td class="amt">' + fmt(s.income) + '</td><td class="amt">100%</td></tr></tbody></table>'
      : '<p class="muted small">Bu oyda daromad qayd etilmagan.</p>') +

    "<h3 style=\"font-size:15px;margin:20px 0 9px\">Hisoblar holati</h3>" +
    "<table><thead><tr><th>Hisob</th><th>Turi</th><th style=\"text-align:right\">Joriy qoldiq</th></tr></thead><tbody>" +
    S.accounts.filter(a => !a.archived).map(a => "<tr><td>" + a.icon + " " + esc(a.name) + "</td><td>" + (ACCOUNT_TYPES[a.type]||ACCOUNT_TYPES.other).label + "</td>" +
      '<td class="amt">' + fmt(Calc.accountBalance(a.id), a.currency) + "</td></tr>").join("") +
    '<tr style="font-weight:700"><td colspan="2">Umumiy balans</td><td class="amt">' + fmt(Calc.totalBalance()) + "</td></tr></tbody></table>" +

    (S.debts.length ? "<h3 style=\"font-size:15px;margin:20px 0 9px\">Qarzlar</h3>" +
      "<table><thead><tr><th>Shaxs</th><th>Yo'nalish</th><th>Holat</th><th style=\"text-align:right\">Qolgan</th></tr></thead><tbody>" +
      S.debts.map(d => "<tr><td>" + esc(d.person) + "</td><td>" + (d.dir === "given" ? "Men berdim" : "Men oldim") + "</td>" +

    (S.budgets.length ? "<h3 style=\"font-size:15px;margin:20px 0 9px\">Byudjet bajarilishi</h3>" +

      S.budgets.map(b => { const st = Calc.budgetState(b, mk); return "<tr><td>" + esc(Calc.budgetName(b)) + '</td><td class="amt">' + fmt(b.amount) + "</td>" +
        '<td class="amt">' + fmt(st.spent) + '</td><td class="amt">' + fmt(st.left) + '</td><td class="amt">' + Math.round(st.pct) + "%</td></tr>"; }).join("") + "</tbody></table>" : "") +

    ((S.credits || []).length ? "<h3 style=\"font-size:15px;margin:20px 0 9px\">Kreditlar</h3>" +
      "<table><thead><tr><th>Kredit</th><th>Stavka</th><th style=\"text-align:right\">Qolgan qarz</th><th style=\"text-align:right\">Bu oy to'lov</th><th style=\"text-align:right\">Jami foiz (reja)</th></tr></thead><tbody>" +
      S.credits.map(c => "<tr><td>" + esc(c.name) + "</td><td>" + groupNum(c.rate, 1) + "%</td>" +

}

/* ---------- Kunlik hisobot ---------- */
function reportDaily() {
  const d = UI.reportDay || today();
  const list = Calc.range(d, d, { all: true });
  const norm = list.filter(t => (t.kind || "normal") === "normal");
  const s = Calc.sums(norm);
  const expCats = Calc.byCategory(norm, "expense");
  const incCats = Calc.byCategory(norm, "income");
  const prevDay = Calc.sums(Calc.range(addDays(d, -1), addDays(d, -1)));
  const balEnd = Calc.balanceAsOf(d), balStart = Calc.balanceAsOf(addDays(d, -1));

  /* soatlar kesimi — faqat harakat bo'lgan soatlar */
  const hours = {};
  for (const t of norm) {
    const h = (t.time || "00:00").slice(0, 2);
    hours[h] = hours[h] || { a: 0, b: 0, n: 0 };
    if (t.type === "income") hours[h].a += Calc.main(t);
    else if (t.type === "expense") hours[h].b += Calc.main(t);
    hours[h].n++;
  }
  const hourKeys = Object.keys(hours).sort();
  const hourData = hourKeys.map(h => ({ label: h + ":00", a: hours[h].a, b: hours[h].b }));
  const byAcc = S.accounts.filter(a => !a.archived).map(a => {
    const inc = list.filter(t => t.type === "income" && t.accountId === a.id).reduce((x, t) => x + t.amount, 0);
    const exp = list.filter(t => t.type === "expense" && t.accountId === a.id).reduce((x, t) => x + t.amount, 0);
    const trIn = list.filter(t => t.type === "transfer" && t.toAccountId === a.id).reduce((x, t) => x + (t.toAmount != null ? t.toAmount : t.amount), 0);
    const trOut = list.filter(t => t.type === "transfer" && t.accountId === a.id).reduce((x, t) => x + t.amount, 0);
    return { a, inc, exp, trIn, trOut, n: list.filter(t => t.accountId === a.id || t.toAccountId === a.id).length };
  }).filter(x => x.n > 0);

  return '<div class="card card-pad">' +
    '<div style="display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--teal-700);padding-bottom:14px;margin-bottom:16px">' +
    '<div class="brand-mark" style="background:var(--teal-700)"><svg width="20" height="20" viewBox="0 0 64 64"><path d="M32 12c8 0 14 6 14 14v26H18V26c0-8 6-14 14-14z" fill="none" stroke="#F2C14E" stroke-width="5"/><path d="M24 45l7-8 5 5 9-12" fill="none" stroke="#F2C14E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
    '<div><h2 style="font-size:19px">Kunlik hisobot — ' + longDate(d) + "</h2>" +
    '<div class="small muted">' + WEEKDAYS[parseYmd(d).getDay()] + " · " + list.length + " ta yozuv · Moliyam v" + APP_VERSION + "</div></div>" +
    '<div style="margin-left:auto;text-align:right"><div class="small muted">Kun yakuni</div>' +
    '<div class="num" style="font-size:21px;font-weight:700;color:' + (s.net >= 0 ? "var(--up)" : "var(--down)") + '">' + fmt(s.net) + "</div></div></div>" +

    '<div class="grid g-4" style="margin-bottom:18px">' +
    '<div><div class="small muted">Kirim</div><div class="num" style="font-size:19px;font-weight:700;color:var(--up)">' + fmt(s.income) + "</div></div>" +
    '<div><div class="small muted">Chiqim</div><div class="num" style="font-size:19px;font-weight:700;color:var(--down)">' + fmt(s.expense) + "</div></div>" +
    '<div><div class="small muted">Kecha sof oqimi</div><div class="num" style="font-size:19px;font-weight:700">' + fmt(prevDay.net) + "</div></div>" +
    '<div><div class="small muted">Kun oxiridagi balans</div><div class="num" style="font-size:19px;font-weight:700">' + fmt(balEnd) + "</div></div></div>" +

    '<div class="small muted" style="margin-bottom:18px">Kun boshidagi balans: <b class="num" style="color:var(--ink)">' + fmt(balStart) + "</b> → kun oxirida <b class=\"num\" style=\"color:var(--ink)\">" + fmt(balEnd) + "</b></div>" +

    (hourData.length ? "<h3 style=\"font-size:15px;margin-bottom:9px\">Soatlar kesimi</h3>" +
      Chart.bars(hourData, { height: 180 }) +
      '<div style="display:flex;gap:18px;justify-content:center;margin:8px 0 18px;font-size:13px">' +
      '<span style="display:flex;align-items:center;gap:6px"><i class="dot" style="background:var(--up)"></i>Kirim</span>' +
      '<span style="display:flex;align-items:center;gap:6px"><i class="dot" style="background:var(--down)"></i>Chiqim</span></div>' +
      "<table><thead><tr><th>Soat</th><th style=\"text-align:right\">Kirim</th><th style=\"text-align:right\">Chiqim</th><th style=\"text-align:right\">Farq</th><th style=\"text-align:right\">Yozuv</th></tr></thead><tbody>" +
      hourKeys.map(h => "<tr><td>" + h + ":00 — " + h + ':59</td><td class="amt" style="color:var(--up)">' + (hours[h].a ? fmt(hours[h].a) : "—") + "</td>" +
        '<td class="amt" style="color:var(--down)">' + (hours[h].b ? fmt(hours[h].b) : "—") + "</td>" +
        '<td class="amt">' + fmt(hours[h].a - hours[h].b) + '</td><td class="amt">' + hours[h].n + "</td></tr>").join("") +
      '<tr style="font-weight:700"><td>Jami</td><td class="amt">' + fmt(s.income) + '</td><td class="amt">' + fmt(s.expense) +
      '</td><td class="amt">' + fmt(s.net) + '</td><td class="amt">' + norm.length + "</td></tr></tbody></table>"
      : '<p class="muted small">Bu kunda operatsiya qayd etilmagan.</p>') +

    (list.length ? "<h3 style=\"font-size:15px;margin:20px 0 9px\">Kun operatsiyalari</h3>" +
      "<table><thead><tr><th>Vaqt</th><th>Tavsif</th><th>Hisob</th><th>Izoh</th><th style=\"text-align:right\">Summa</th></tr></thead><tbody>" +
      list.slice().sort((a, b) => (a.time || "").localeCompare(b.time || "")).map(t => {
        const a = Calc.account(t.accountId);
        return "<tr><td>" + (t.time || "—") + "</td><td>" + esc(txnTitle(t)) +
          (t.kind === "debt" ? ' <span class="tag">qarz</span>' : t.kind === "goal" ? ' <span class="tag">maqsad</span>' : t.kind === "credit" ? ' <span class="tag">kredit</span>' : "") + "</td>" +
          "<td>" + esc(a ? a.name : "—") + '</td><td class="muted small">' + esc(t.note || "—") + "</td><td>" + amtCell(t) + "</td></tr>";
      }).join("") + "</tbody></table>" : "") +

    (expCats.length ? "<h3 style=\"font-size:15px;margin:20px 0 9px\">Kun xarajatlari kategoriyalar bo\'yicha</h3>" +
      "<table><thead><tr><th>Kategoriya</th><th style=\"text-align:right\">Summa</th><th style=\"text-align:right\">Ulush</th></tr></thead><tbody>" +
      expCats.map(c => "<tr><td>" + c.icon + " " + esc(c.name) + '</td><td class="amt">' + fmt(c.value) + "</td>" +
        '<td class="amt">' + Math.round(c.value / (s.expense || 1) * 100) + "%</td></tr>").join("") + "</tbody></table>" : "") +

    (incCats.length ? "<h3 style=\"font-size:15px;margin:20px 0 9px\">Kun daromadlari</h3>" +
      "<table><thead><tr><th>Manba</th><th style=\"text-align:right\">Summa</th></tr></thead><tbody>" +
      incCats.map(c => "<tr><td>" + c.icon + " " + esc(c.name) + '</td><td class="amt">' + fmt(c.value) + "</td></tr>").join("") + "</tbody></table>" : "") +

    (byAcc.length ? "<h3 style=\"font-size:15px;margin:20px 0 9px\">Hisoblar bo\'yicha</h3>" +
      "<table><thead><tr><th>Hisob</th><th style=\"text-align:right\">Kirim</th><th style=\"text-align:right\">Chiqim</th><th style=\"text-align:right\">O'tkazma</th><th style=\"text-align:right\">Joriy qoldiq</th></tr></thead><tbody>" +
      byAcc.map(x => "<tr><td>" + x.a.icon + " " + esc(x.a.name) + '</td><td class="amt">' + (x.inc ? fmt(x.inc, x.a.currency) : "—") + "</td>" +
        '<td class="amt">' + (x.exp ? fmt(x.exp, x.a.currency) : "—") + "</td>" +
        '<td class="amt">' + (x.trIn || x.trOut ? (x.trIn ? "+" + fmt(x.trIn, x.a.currency) : "") + (x.trIn && x.trOut ? " / " : "") + (x.trOut ? "−" + fmt(x.trOut, x.a.currency) : "") : "—") + "</td>" +
        '<td class="amt">' + fmt(Calc.accountBalance(x.a.id), x.a.currency) + "</td></tr>").join("") + "</tbody></table>" : "") +

    '<p class="small muted" style="margin-top:20px">Hisobot Moliyam ilovasida avtomatik shakllantirildi. Barcha ma\'lumotlar shu qurilmada saqlanadi.</p>' +
    "</div>";
}

/* ---------- Eksport ---------- */
function txnRows(list) {
  return list.map(t => {
    const a = Calc.account(t.accountId), b = Calc.account(t.toAccountId);
    return {
      Sana: t.date, Vaqt: t.time || "", Turi: t.type === "income" ? "Kirim" : t.type === "expense" ? "Chiqim" : "O'tkazma",
      Kategoriya: t.type === "transfer" ? "" : (Calc.category(t.categoryId) || {}).name || "Kategoriyasiz",
      Hisob: a ? a.name : "", "Qabul qiluvchi hisob": b ? b.name : "",
      Summa: t.amount, Valyuta: a ? a.currency : S.settings.currency,
      Izoh: t.note || "", Teglar: (t.tags || []).join(" ")
    };
  });
}
function download(name, content, mime) {
  const blob = new Blob([content], { type: mime || "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 400);
}
function exportCsv() {
  const rows = txnRows(filteredTxns().length ? filteredTxns() : S.transactions);
  if (!rows.length) { toast("Eksport uchun ma'lumot yo'q", "bad"); return; }
  const heads = Object.keys(rows[0]);
  const csv = "\uFEFF" + heads.join(";") + "\n" +
    rows.map(r => heads.map(h => '"' + String(r[h]).replace(/"/g, '""') + '"').join(";")).join("\n");
  download("moliyam-operatsiyalar-" + today() + ".csv", csv, "text/csv;charset=utf-8");
  toast("CSV fayl yuklandi", "ok");
}
function exportExcel() {
  const rows = txnRows(S.transactions);
  const heads = rows.length ? Object.keys(rows[0]) : [];
  const style = "<style>table{border-collapse:collapse}td,th{border:1px solid #999;padding:4px 7px;font-family:Calibri,sans-serif;font-size:11pt}th{background:#0E7C7B;color:#fff}</style>";
  const t1 = "<h3>Operatsiyalar</h3><table><tr>" + heads.map(h => "<th>" + h + "</th>").join("") + "</tr>" +
    rows.map(r => "<tr>" + heads.map(h => "<td>" + esc(r[h]) + "</td>").join("") + "</tr>").join("") + "</table>";
  const t2 = "<h3>Hisoblar</h3><table><tr><th>Hisob</th><th>Turi</th><th>Valyuta</th><th>Qoldiq</th></tr>" +
    S.accounts.map(a => "<tr><td>" + esc(a.name) + "</td><td>" + (ACCOUNT_TYPES[a.type]||ACCOUNT_TYPES.other).label + "</td><td>" + a.currency + "</td><td>" + Calc.accountBalance(a.id) + "</td></tr>").join("") + "</table>";
  const t3 = "<h3>Qarzlar</h3><table><tr><th>Shaxs</th><th>Yo'nalish</th><th>Umumiy summa</th><th>To'langan</th><th>Chegirma</th><th>Qolgan</th><th>Muddat</th><th>Holat</th></tr>" +
    S.debts.map(d => "<tr><td>" + esc(d.person) + "</td><td>" + (d.dir === "given" ? "Men berdim" : "Men oldim") + "</td><td>" + Calc.debtTotal(d) + "</td><td>" +
      Calc.debtPaid(d) + "</td><td>" + Calc.debtDiscount(d) + "</td><td>" + Calc.debtLeft(d) + "</td><td>" + (d.due || "") + "</td><td>" + Calc.debtStatus(d).label + "</td></tr>").join("") + "</table>";
  const html = '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8">' + style + "</head><body>" + t1 + t2 + t3 + "</body></html>";
  download("moliyam-hisobot-" + today() + ".xls", "\uFEFF" + html, "application/vnd.ms-excel");
  toast("Excel fayl yuklandi", "ok");
}

<script>
"use strict";
/* ============================================================

function saveCat(e, id) {
  e.preventDefault();
  const f = e.target;
  if (!f.name.value.trim()) { toast("Kategoriya nomini kiriting", "bad"); return false; }
  const rec = { id: id || uid(), name: f.name.value.trim(), type: f.dataset.type, icon: f.dataset.icon, color: f.dataset.color, archived: false };
  if (id) { const i = S.categories.findIndex(c => c.id === id); S.categories[i] = rec; }
  else S.categories.push(rec);
  persist(); closeModal(); render(); toast(id ? "Kategoriya yangilandi" : "Kategoriya qo'shildi", "ok");
  return false;
}
async function delCat(id) {
  const used = S.transactions.filter(t => t.categoryId === id).length;
  const c = Calc.category(id);
  if (!(await confirmDlg({
    title: "Kategoriya o'chirilsinmi?",
    text: used ? "<b>" + esc(c.name) + "</b> kategoriyasida " + used + " ta operatsiya bor. Ular \"Kategoriyasiz\" bo'lib qoladi." : "<b>" + esc(c.name) + "</b> o'chiriladi.",
    ok: "O'chirish", danger: true
  }))) return;
  S.transactions.forEach(t => { if (t.categoryId === id) t.categoryId = null; });
  S.budgets = S.budgets.filter(b => b.categoryId !== id);
  S.categories = S.categories.filter(x => x.id !== id);
  persist(); render(); toast("Kategoriya o'chirildi", "ok");
}

/* ---------- Avtomatik saqlash: holat, faylga bog'lash, ichki nusxalar ---------- */
function stamp(iso) {
  const d = typeof iso === "string" ? new Date(iso) : iso;
  if (!d || isNaN(d)) return "—";
  const s = today() === d.toISOString().slice(0, 10) ? "Bugun" : longDate(d.toISOString().slice(0, 10));
  return s + ", " + hhmm(d);
}
